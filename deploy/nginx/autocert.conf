# INHERIT AutoCert — HTTPS 리버스 프록시(nginx) 설정. 절차는 docs/manual/TLS.md.
# docker-compose.https.yml의 proxy 서비스가 이 파일을
# /etc/nginx/conf.d/default.conf 로 읽기 전용 마운트한다.
#
# 반입한 서버 인증서·개인키는 deploy/tls/ 에 둔다(git 미추적 — .gitignore).
#   deploy/tls/server.crt : 리프 인증서 + 중간 CA를 이 순서로 이어붙인 PEM
#   deploy/tls/server.key : 개인키 PEM (암호 없이 — nginx가 기동 시 물어보면 컨테이너가 뜨지 않는다)

# WebSocket/업그레이드 요청 통과용. map은 http 컨텍스트 지시어이고 conf.d/*.conf는
# http 안에서 include되므로 여기 두면 된다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 평문 접속은 HTTPS로 되돌린다 — 콘솔 주소를 http로 기억하는 습관을 남기지 않는다.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    return 308 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;

    # 실제 접속 FQDN으로 바꾼다(서버 인증서 SAN과 일치해야 한다).
    # 이름이 정해지지 않았으면 `_` 그대로 둬도 동작한다.
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    # 폐쇄망이라도 하한은 TLS 1.2다. TLS 1.0/1.1 전용 클라이언트는 지원하지 않는다.
    ssl_protocols            TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache        shared:SSL:10m;
    ssl_session_timeout      1d;
    ssl_session_tickets      off;

    # HSTS는 기본 비활성이다. 자체 서명·미신뢰 CA 상태에서 켜면 브라우저의
    # "위험을 감수하고 계속" 우회가 영구 차단되어 콘솔에 아예 못 들어간다.
    # 사내 CA 인증서를 관리자 PC 신뢰 저장소에 배포한 뒤 주석을 푼다 (TLS.md 6.2).
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 인증서 업로드 상한은 1 MiB다(INSTALL.md 3.1). multipart 오버헤드까지 감안해
    # 넉넉히 잡는다 — nginx 기본값 1m이면 경계값 업로드가 413으로 잘린다.
    client_max_body_size 4m;

    # Docker 내장 DNS. 업스트림 이름을 변수로 넘겨 **요청 시점에** 해석하게 한다 —
    # proxy_pass에 이름을 직접 쓰면 nginx가 기동 시 1회만 해석하므로 ① frontend가
    # 아직 없으면 nginx가 아예 뜨지 않고 ② frontend를 재생성해 IP가 바뀌면 계속 502다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # 업스트림은 웹 콘솔 하나뿐이다. 브라우저의 /api/* 호출도 콘솔(Next.js)이
        # backend로 다시 중계하므로(INSTALL.md 3.3) API 클라이언트도 이 주소를 쓴다.
        set $autocert_console http://frontend:3000;
        proxy_pass         $autocert_console;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # CSV 내보내기 등 큰 응답을 감안한 여유값.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
