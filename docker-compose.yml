# INHERIT_AutoCert 개발환경. 실행: cp .env.example .env && docker compose up --build
#
# 포트는 전부 .env로 바꿀 수 있다 (INSTALL.md 5.5 "포트 변경 절차").
#   호스트 노출:  FRONTEND_PORT(3000) / BACKEND_PORT(8080) / SENSOR_GATEWAY_PORT(8443)
#   컨테이너 내부: BACKEND_INTERNAL_PORT(8080) / SENSOR_GATEWAY_INTERNAL_PORT(8443)
# BACKEND_INTERNAL_PORT를 바꾸면 frontend를 **재빌드**해야 한다 — 프록시 대상
# (BACKEND_INTERNAL_URL)이 빌드 시점에 고정되기 때문이다(아래 frontend 주석).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autocert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-autocert}
    # DB는 기본적으로 호스트에 노출하지 않는다 — backend 컨테이너만 접근하면 되고,
    # 5432가 열려 있으면 인증서 인벤토리 전체가 호스트 네트워크에 노출된다.
    # 백업·psql 접속 등으로 임시로 열어야 하면 docker-compose.db-expose.yml을 겹친다
    # (INSTALL.md 5.5절). 컨테이너 간 통신은 노출 없이도 그대로 된다.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autocert} -d ${POSTGRES_DB:-autocert}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    # 이미지 이름·태그를 고정한다. 태그를 compose 프로젝트명에 맡기면 오프라인 반입
    # (docker save/load) 때 어떤 이미지를 담고 적재했는지 특정할 수 없다.
    # 버전 기본값은 루트 VERSION 파일과 같아야 한다(scripts/bundle-offline.sh가 검사한다).
    image: ${AUTOCERT_IMAGE_PREFIX:-inherit-autocert}/backend:${AUTOCERT_VERSION:-0.1.0}
    build: ./backend
    ports:
      # "호스트:컨테이너". 호스트 포트만 바꾸는 것이 가장 안전하다 —
      # 컨테이너 쪽(BACKEND_INTERNAL_PORT)을 바꾸면 frontend 재빌드가 필요하다.
      - "${BACKEND_PORT:-8080}:${BACKEND_INTERNAL_PORT:-8080}"
      # 센서 게이트웨이(mTLS). SENSOR_CA_ENC_KEY 미설정이면 백엔드가 리스너를 열지 않는다.
      # 센서 포트를 바꿔도 등록된 센서의 재등록은 필요 없다 (INSTALL.md 5.5.2).
      - "${SENSOR_GATEWAY_PORT:-8443}:${SENSOR_GATEWAY_INTERNAL_PORT:-8443}"
    environment:
      HTTP_ADDR: ":${BACKEND_INTERNAL_PORT:-8080}"
      DATABASE_URL: postgres://${POSTGRES_USER:-autocert}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autocert}?sslmode=disable
      SESSION_TTL: ${SESSION_TTL:-8h}
      # 세션 쿠키 Secure 플래그. 기본 false(평문 HTTP 배포) — HTTPS 리버스 프록시로
      # TLS를 종단할 때만 true다. docker-compose.https.yml이 자동으로 켠다(docs/manual/TLS.md).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # users 테이블이 비어 있을 때만 초기 System Administrator를 만든다.
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # 센서 CA 개인키 봉인 키 (hex 64자). 센서(Phase 3a)를 쓸 때만 필요하다.
      SENSOR_CA_ENC_KEY: ${SENSOR_CA_ENC_KEY:-}
      # 센서 게이트웨이 리슨 주소와, 센서가 접속할 DNS/IP(콤마 구분 — 서버 인증서 SAN).
      # 리슨 포트는 위 ports의 컨테이너 쪽과 반드시 같아야 한다 — 어긋나면 리스너는
      # 떠 있는데 아무도 접속하지 못하므로, .env의 SENSOR_LISTEN_ADDR을 직접 받지 않고
      # SENSOR_GATEWAY_INTERNAL_PORT 하나에서 파생시킨다 (INSTALL.md 5.5절).
      # SENSOR_ADVERTISED_HOSTS에는 **포트를 적지 않는다** — 포트가 붙은 항목은
      # 기동 시 경고와 함께 무시된다(SAN에 들어가면 센서 TLS 검증이 깨진다).
      SENSOR_LISTEN_ADDR: ":${SENSOR_GATEWAY_INTERNAL_PORT:-8443}"
      SENSOR_ADVERTISED_HOSTS: ${SENSOR_ADVERTISED_HOSTS:-}
      # --- 만료 알림 (INSTALL.md 5.2.1) ---
      # 전부 비어 있어도 정상이다. 채널 설정이 비면 그 채널만 비활성화되고 코어 API는 뜬다.
      # 알림함(inbox)은 외부 설정 없이 기본 활성이라 아무것도 안 채워도 UI 알림은 동작한다.
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
      NOTIFY_SCAN_INTERVAL: ${NOTIFY_SCAN_INTERVAL:-1h}
      # seed = 첫 판정에서 이미 지난 임계값을 발송하지 않고 침묵 처리(설치 당일 폭주 방지).
      NOTIFY_FIRST_RUN: ${NOTIFY_FIRST_RUN:-seed}
      NOTIFY_RETENTION_DAYS: ${NOTIFY_RETENTION_DAYS:-180}
      # 알림 본문 딥링크의 기준 URL (예: http://10.20.0.5:3000). 비우면 링크만 생략된다.
      NOTIFY_BASE_URL: ${NOTIFY_BASE_URL:-}
      # SMTP — SMTP_HOST가 비면 메일 채널만 비활성.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      # 비밀값은 기본값을 두지 않는다 — .env에 없으면 빈 문자열로 들어간다.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # 파일이 있으면 SMTP_PASSWORD보다 우선한다(Docker secret 경로). 파일 자체는 별도 마운트 필요.
      SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      # 사내 사설 CA 경로(컨테이너 내부 경로 — 볼륨 마운트 필요). INSECURE_SKIP_VERIFY 대신 이걸 쓴다.
      SMTP_CA_FILE: ${SMTP_CA_FILE:-}
      SMTP_TLS_INSECURE_SKIP_VERIFY: ${SMTP_TLS_INSECURE_SKIP_VERIFY:-false}
      # 웹훅 — WEBHOOK_URL이 비면 웹훅 채널만 비활성.
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-}
      WEBHOOK_AUTH_HEADER: ${WEBHOOK_AUTH_HEADER:-}
      WEBHOOK_CA_FILE: ${WEBHOOK_CA_FILE:-}
      # Syslog — SYSLOG_ADDR이 비면 Syslog 채널만 비활성. udp는 fire-and-forget(수신 보장 없음).
      SYSLOG_ADDR: ${SYSLOG_ADDR:-}
      SYSLOG_NETWORK: ${SYSLOG_NETWORK:-udp}
      SYSLOG_FACILITY: ${SYSLOG_FACILITY:-local0}
      SYSLOG_APP_NAME: ${SYSLOG_APP_NAME:-autocert}
      # --- 전 포트 백그라운드 스윕 (INSTALL.md 5.2.2) ---
      # RATE_PPS를 올리면 빨라지지만 방화벽·IPS가 포트스캔으로 탐지·차단할 수 있다.
      SCAN_SWEEP_ENABLED: ${SCAN_SWEEP_ENABLED:-true}
      SCAN_SWEEP_RATE_PPS: ${SCAN_SWEEP_RATE_PPS:-10}
      SCAN_SWEEP_CONCURRENCY: ${SCAN_SWEEP_CONCURRENCY:-8}
      SCAN_SWEEP_CHUNK_ENDPOINTS: ${SCAN_SWEEP_CHUNK_ENDPOINTS:-4096}
      SCAN_SWEEP_CHUNK_GAP: ${SCAN_SWEEP_CHUNK_GAP:-5s}
      SCAN_SWEEP_MAX_DAYS: ${SCAN_SWEEP_MAX_DAYS:-30}
      SCAN_SWEEP_STALL_AFTER: ${SCAN_SWEEP_STALL_AFTER:-10m}
      # --- 관리 콘솔 접근 IP 제한 (INSTALL.md 5.2.3) ---
      # 허용 목록 자체는 DB에 있고 화면에서 관리한다. 목록이 비면 제한 없음이다.
      # 이 구성(브라우저 → frontend → backend)에서는 백엔드가 보는 출발지가 frontend
      # 컨테이너다 — 아래를 채우지 않으면 브라우저 IP 기준으로 제한할 수 없다.
      ADMIN_IP_TRUSTED_PROXIES: ${ADMIN_IP_TRUSTED_PROXIES:-}
      # 화면에서 자기 자신을 막았을 때의 복구 경로. 비우면 적용되지 않는다.
      ADMIN_IP_ALLOW_BOOTSTRAP: ${ADMIN_IP_ALLOW_BOOTSTRAP:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${AUTOCERT_IMAGE_PREFIX:-inherit-autocert}/frontend:${AUTOCERT_VERSION:-0.1.0}
    build:
      context: ./frontend
      args:
        # 프록시 대상은 rewrites 설정에 빌드 시점 고정되므로 environment가 아니라 build args로 넘긴다.
        # 브라우저 → frontend(/api/*) → backend 중계 구조라 컨테이너 내부 주소를 쓴다.
        # BACKEND_INTERNAL_PORT를 바꿨다면 `docker compose up --build`로 frontend를
        # 다시 빌드해야 반영된다 — 재기동만으로는 옛 포트가 그대로 남는다.
        BACKEND_INTERNAL_URL: http://backend:${BACKEND_INTERNAL_PORT:-8080}
    ports:
      # 컨테이너 쪽 3000은 이미지의 PORT 기본값이다 — 호스트 포트만 바꾼다.
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
