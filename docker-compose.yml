# INHERIT_AutoCert 개발환경. 실행: cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autocert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-autocert}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autocert} -d ${POSTGRES_DB:-autocert}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-autocert}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-autocert}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  # frontend는 별도 작업에서 frontend/ 디렉터리에 생성된다. compose 배선만 미리 해둔다.
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
