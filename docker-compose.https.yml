# INHERIT AutoCert — HTTPS 리버스 프록시 오버레이 (선택 구성). 절차는 docs/manual/TLS.md.
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# 이 파일을 쓰지 않으면 기존 HTTP 구성 그대로다 — base(docker-compose.yml)는 건드리지 않는다.
# `ports: !override`는 Docker Compose v2.24.4 이상이 필요하다. 더 낮은 버전이면 이 오버레이의
# ports 블록 2개를 지우고(포트가 추가 병합된다) base의 ports를 직접 손본다.
#
# 포트는 base와 같은 .env 변수를 그대로 쓴다 (INSTALL.md 5.5절). 프록시가 쓰는
# HTTPS_PORT(443)·HTTP_REDIRECT_PORT(80)만 이 오버레이 전용이다.
services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_REDIRECT_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # 설정과 인증서 모두 읽기 전용 마운트. 개인키는 컨테이너 안에서도 쓰기 불가다.
      - ./deploy/nginx/autocert.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      - frontend

  backend:
    environment:
      # TLS 종단 뒤에서만 켠다. 평문 http로 접속하면 브라우저가 Secure 쿠키를 버려
      # 로그인이 조용히 실패한다 (TLS.md 7장).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    # 평문 API(8080)는 호스트 루프백으로만 남긴다 — 외부는 프록시(443)를 거친다.
    # 센서 게이트웨이(8443)는 그 자체가 mTLS라 TLS 종단 대상이 아니므로 그대로 연다.
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8080}:${BACKEND_INTERNAL_PORT:-8080}"
      - "${SENSOR_GATEWAY_PORT:-8443}:${SENSOR_GATEWAY_INTERNAL_PORT:-8443}"

  frontend:
    # 3000 직결을 남기면 HTTPS를 우회할 수 있다 — 프록시를 통해서만 들어오게 한다.
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
