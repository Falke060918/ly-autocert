name: 잡무 / 유지보수
description: 빌드, 설정, 문서, 의존성 등 기능 외 작업을 등록한다.
title: "[chore] "
labels: [chore]
body:
  - type: textarea
    id: task
    attributes:
      label: 작업 내용
      description: 무엇을 할 것인가. 대상 파일이나 범위를 함께 적는다.
      placeholder: CI에 shellcheck 스텝을 추가하고 scripts/ 아래 셸 스크립트를 검사한다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이 이슈가 곧 작업 경계다. 검증 가능한 문장으로, 한 줄에 하나씩 적는다.
      placeholder: |
        - main 브랜치 push 시 CI가 초록불로 통과한다
        - scripts/setup.sh에 shellcheck 경고가 없다
    validations:
      required: true
