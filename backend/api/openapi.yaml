openapi: "3.0.3"
info:
  title: INHERIT_AutoCert API
  description: >
    폐쇄망·레거시 환경용 온프레미스 인증서 라이프사이클 관리(CLM) 플랫폼 API.
    Phase 1(인증서 인벤토리) 범위. 엔드포인트는 구현과 함께 추가한다.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: 로컬 개발 (docker compose)
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 서버·DB 헬스체크
      description: 서버 생존 여부와 PostgreSQL 연결 상태(ping)를 반환한다.
      tags: [system]
      responses:
        "200":
          description: 서버와 DB 모두 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
              example:
                status: ok
                database: up
        "503":
          description: DB 연결 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
              example:
                status: unavailable
                database: down
  /api/v1/certificates/import:
    post:
      operationId: importCertificates
      summary: 인증서 파일 업로드 (수동 등록)
      description: >
        PEM(체인 포함) 또는 DER 인증서를 업로드한다. SHA-256 fingerprint 기준으로
        중복을 판정해, 중복이면 새 Certificate를 만들지 않고 설치 위치만 추가한다.
        개인키가 포함된 업로드는 저장 없이 거부한다. 모든 요청은 감사 이벤트를 남긴다.
        허용 역할은 system_administrator·pki_administrator·operator다.
      tags: [certificates]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: 새 인증서가 1개 이상 등록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "200":
          description: 전부 중복 — Certificate는 그대로, 설치 위치만 추가됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: >
            잘못된 업로드. code는 invalid_upload / empty_upload /
            private_key_rejected / invalid_certificate 중 하나.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: 저장 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 로컬 계정 로그인
      description: >
        자격 증명 검증 후 세션 토큰을 발급한다. 응답 본문 token(Bearer용)과
        HttpOnly 쿠키(브라우저용)를 함께 준다. 성공·실패 모두 감사 이벤트를 남긴다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, user]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 (세션 폐기)
      tags: [auth]
      responses:
        "204": { description: 세션 폐기 완료 }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: 현재 인증된 사용자 조회
      tags: [auth]
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: 사용자 목록 (System Administrator 전용)
      tags: [users]
      responses:
        "200":
          description: 사용자 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  total: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: 사용자 생성 (System Administrator 전용)
      description: 비밀번호 정책(12자 이상, username과 상이)을 검사한다. 감사 이벤트를 남긴다.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 12 }
                display_name: { type: string, nullable: true }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: 생성된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: 비밀번호 정책 위반 또는 잘못된 역할
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: username 중복
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
security:
  - bearerAuth: []
  - cookieAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 로그인 응답의 token
    cookieAuth:
      type: apiKey
      in: cookie
      name: autocert_session
  responses:
    Unauthorized:
      description: 인증 실패 (토큰 없음·만료·폐기)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 역할 권한 부족 (authz.denied 감사 이벤트 기록)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ImportResult:
      type: object
      required: [request_id, imported, location_id]
      properties:
        request_id:
          type: string
        imported:
          type: array
          items:
            $ref: "#/components/schemas/ImportedCertificate"
        location_id:
          type: string
          format: uuid
    ImportedCertificate:
      type: object
      required:
        [id, fingerprint_sha256, common_name, not_before, not_after,
         certificate_type, status, duplicate]
      properties:
        id:
          type: string
          format: uuid
        fingerprint_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        common_name:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        certificate_type:
          type: string
          enum: [server, client, ca, code_signing, email, other]
        status:
          type: string
          enum: [active, expired, revoked, replaced, unknown]
        duplicate:
          type: boolean
          description: true면 fingerprint 중복 — 기존 레코드 재사용
    Healthz:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [up, down]
    Role:
      type: string
      description: 기본 역할 6종 (00-spec 7.11)
      enum:
        - system_administrator
        - pki_administrator
        - security_administrator
        - operator
        - auditor
        - viewer
    User:
      type: object
      description: 로컬 계정. password_hash는 어떤 응답에도 포함되지 않는다.
      required: [id, username, role, auth_provider, is_active]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        auth_provider: { type: string, description: "MVP는 local. LDAP/AD/OIDC/SAML 확장점." }
        is_active: { type: boolean }
        department_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      description: 통일 오류 응답 (00-spec 13장)
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }
