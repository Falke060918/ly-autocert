openapi: "3.0.3"
info:
  title: INHERIT_AutoCert API
  description: >
    폐쇄망·레거시 환경용 온프레미스 인증서 라이프사이클 관리(CLM) 플랫폼 API.
    Phase 1(인증서 인벤토리) 범위. 엔드포인트는 구현과 함께 추가한다.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: 로컬 개발 (docker compose)
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 서버·DB 헬스체크
      description: 서버 생존 여부와 PostgreSQL 연결 상태(ping)를 반환한다.
      tags: [system]
      responses:
        "200":
          description: 서버와 DB 모두 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
              example:
                status: ok
                database: up
        "503":
          description: DB 연결 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
              example:
                status: unavailable
                database: down
  /api/v1/certificates/import:
    post:
      operationId: importCertificates
      summary: 인증서 파일 업로드 (수동 등록)
      description: >
        PEM(체인 포함) 또는 DER 인증서를 업로드한다. SHA-256 fingerprint 기준으로
        중복을 판정해, 중복이면 새 Certificate를 만들지 않고 설치 위치만 추가한다.
        개인키가 포함된 업로드는 저장 없이 거부한다. 모든 요청은 감사 이벤트를 남긴다.
        허용 역할은 system_administrator·pki_administrator·operator다.
      tags: [certificates]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: 새 인증서가 1개 이상 등록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "200":
          description: 전부 중복 — Certificate는 그대로, 설치 위치만 추가됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: >
            잘못된 업로드. code는 invalid_upload / empty_upload /
            private_key_rejected / invalid_certificate 중 하나.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: 저장 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/certificates:
    get:
      operationId: listCertificates
      summary: 인증서 목록 (검색·필터·정렬·페이지네이션)
      description: >
        인벤토리 인증서 목록을 조회한다. 인증된 전 역할(6종) 접근 가능.
        만료 관련 필터(expired, expires_within_days)는 저장된 status가 아니라
        not_after에서 파생 계산한다. 읽기 전용이라 감사 이벤트를 남기지 않는다.
      tags: [certificates]
      parameters:
        - name: q
          in: query
          description: CN·Subject DN·Issuer DN·Serial·Fingerprint·SAN 부분 일치 검색 (대소문자 무시, 200자 이하)
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          description: 상태 필터. 반복 지정 또는 쉼표 구분 다중 값 허용.
          schema:
            type: string
            enum: [active, expired, revoked, replaced, unknown]
        - name: type
          in: query
          description: 인증서 유형 필터. 반복 지정 또는 쉼표 구분 다중 값 허용.
          schema:
            type: string
            enum: [server, client, ca, code_signing, email, other]
        - name: expired
          in: query
          description: not_after 기준 만료 여부 (파생 필터)
          schema: { type: boolean }
        - name: expires_within_days
          in: query
          description: 오늘부터 N일 이내 만료 예정 (이미 만료된 것 제외)
          schema: { type: integer, minimum: 1, maximum: 3650 }
        - name: self_signed
          in: query
          description: 자체 서명 여부 (subject_dn = issuer_dn 파생 필터)
          schema: { type: boolean }
        - name: unowned
          in: query
          description: 소유자 미지정 여부 (owner_id IS NULL 파생 필터)
          schema: { type: boolean }
        - name: sort
          in: query
          description: 정렬 필드 (기본 not_after)
          schema:
            type: string
            enum: [not_after, not_before, common_name, created_at, updated_at,
                   status, certificate_type, public_key_size]
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 인증서 목록 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateList"
        "400":
          description: 잘못된 쿼리 파라미터. code는 invalid_* 형태.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/certificates/summary:
    get:
      operationId: getCertificateSummary
      summary: 대시보드 요약 집계 (만료 구간·자체 서명·소유자 없음)
      description: >
        인벤토리 전체 요약을 반환한다. 만료 구간(7/30/60/90일)은 not_after 파생 계산의
        누적값이며 이미 만료된 것은 제외한다. 인증된 전 역할(6종) 접근 가능. 읽기 전용이라
        감사 이벤트를 남기지 않는다.
      tags: [certificates]
      responses:
        "200":
          description: 요약 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/certificates/{id}:
    get:
      operationId: getCertificate
      summary: 인증서 상세 (설치 위치 목록 포함)
      description: 인증된 전 역할(6종) 접근 가능. 응답에 인증서 원문(PEM/DER)은 포함되지 않는다.
      tags: [certificates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 인증서 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 해당 id의 인증서 없음 (잘못된 uuid 형식 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 로컬 계정 로그인
      description: >
        자격 증명 검증 후 세션 토큰을 발급한다. 응답 본문 token(Bearer용)과
        HttpOnly 쿠키(브라우저용)를 함께 준다. 성공·실패 모두 감사 이벤트를 남긴다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, user]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 (세션 폐기)
      tags: [auth]
      responses:
        "204": { description: 세션 폐기 완료 }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: 현재 인증된 사용자 조회
      tags: [auth]
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: 사용자 목록 (System Administrator 전용)
      tags: [users]
      responses:
        "200":
          description: 사용자 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  total: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: 사용자 생성 (System Administrator 전용)
      description: 비밀번호 정책(12자 이상, username과 상이)을 검사한다. 감사 이벤트를 남긴다.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 12 }
                display_name: { type: string, nullable: true }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: 생성된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: 비밀번호 정책 위반 또는 잘못된 역할
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: username 중복
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/scans:
    post:
      operationId: createDiscoveryScan
      summary: 네트워크 TLS 스캔 시작 (비동기)
      description: >
        IP/CIDR 목록과 포트로 에이전트리스 TLS 스캔 Job을 만든다. 즉시 job_id를 반환하고(202)
        실제 스캔은 백그라운드에서 돈다. 도달 가능한 TLS 엔드포인트의 인증서를 fingerprint
        기준으로 중복 판정해 인벤토리에 저장한다. 자기서명·만료 인증서도 수집한다(수집 전용,
        검증하지 않음). 생성·완료는 감사 이벤트를 남긴다. 허용 역할은
        system_administrator·pki_administrator·operator다.
      tags: [discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "202":
          description: 스캔 Job 생성됨 (백그라운드 실행)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanAccepted" }
        "400":
          description: 잘못된 대상·포트 또는 범위 초과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/discovery/scans/{id}:
    get:
      operationId: getDiscoveryScan
      summary: 스캔 Job 상태·진행률·결과 요약 조회
      tags: [discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 스캔 Job 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
security:
  - bearerAuth: []
  - cookieAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 로그인 응답의 token
    cookieAuth:
      type: apiKey
      in: cookie
      name: autocert_session
  responses:
    Unauthorized:
      description: 인증 실패 (토큰 없음·만료·폐기)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 역할 권한 부족 (authz.denied 감사 이벤트 기록)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ImportResult:
      type: object
      required: [request_id, imported, location_id]
      properties:
        request_id:
          type: string
        imported:
          type: array
          items:
            $ref: "#/components/schemas/ImportedCertificate"
        location_id:
          type: string
          format: uuid
    ImportedCertificate:
      type: object
      required:
        [id, fingerprint_sha256, common_name, not_before, not_after,
         certificate_type, status, duplicate]
      properties:
        id:
          type: string
          format: uuid
        fingerprint_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        common_name:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        certificate_type:
          type: string
          enum: [server, client, ca, code_signing, email, other]
        status:
          type: string
          enum: [active, expired, revoked, replaced, unknown]
        duplicate:
          type: boolean
          description: true면 fingerprint 중복 — 기존 레코드 재사용
    Certificate:
      type: object
      description: 인벤토리 인증서. 개인키·인증서 원문은 포함하지 않는다.
      required:
        [id, fingerprint_sha256, serial_number, subject_dn, issuer_dn, common_name,
         sans, not_before, not_after, public_key_algorithm, public_key_size,
         signature_algorithm, certificate_type, status, auto_renew, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        fingerprint_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        serial_number: { type: string }
        subject_dn: { type: string }
        issuer_dn: { type: string }
        common_name: { type: string }
        sans:
          type: array
          items: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        public_key_algorithm: { type: string }
        public_key_size: { type: integer }
        signature_algorithm: { type: string }
        certificate_type:
          type: string
          enum: [server, client, ca, code_signing, email, other]
        status:
          type: string
          enum: [active, expired, revoked, replaced, unknown]
        ca_id: { type: string, format: uuid, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        environment: { type: string, nullable: true }
        auto_renew: { type: boolean }
        renewal_policy_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CertificateList:
      type: object
      required: [request_id, items, total, page, page_size]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/Certificate" }
        total: { type: integer, description: 필터 적용 후 전체 건수 }
        page: { type: integer }
        page_size: { type: integer }
    CertificateSummary:
      type: object
      description: 대시보드 요약 집계. expiring_* 값은 누적(30d는 7d 포함)이며 만료분 제외.
      required:
        [request_id, total, expiring_7d, expiring_30d, expiring_60d, expiring_90d,
         expired, self_signed, unowned]
      properties:
        request_id: { type: string }
        total: { type: integer }
        expiring_7d: { type: integer }
        expiring_30d: { type: integer }
        expiring_60d: { type: integer }
        expiring_90d: { type: integer }
        expired: { type: integer }
        self_signed: { type: integer, description: subject_dn = issuer_dn 건수 }
        unowned: { type: integer, description: owner_id 미지정 건수 }
    TargetRef:
      type: object
      description: 설치 위치에 붙는 대상 시스템 요약
      required: [id, name, target_type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        target_type: { type: string }
        hostname: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
    CertificateLocation:
      type: object
      required: [id, certificate_id, target_id, location_type, deployment_status, target]
      properties:
        id: { type: string, format: uuid }
        certificate_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        location_type:
          type: string
          enum: [network_endpoint, file, windows_store, keystore, other]
        file_path: { type: string, nullable: true }
        store_name: { type: string, nullable: true }
        service_name: { type: string, nullable: true }
        port: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        last_verified_at: { type: string, format: date-time, nullable: true }
        deployment_status:
          type: string
          enum: [unknown, deployed, pending, failed, removed]
        tls_version:
          type: string
          nullable: true
          description: 네트워크 스캔이 관측한 협상 TLS 버전 (예 TLS 1.2). 스캔 이력이 없으면 null
        target: { $ref: "#/components/schemas/TargetRef" }
    CertificateDetail:
      type: object
      required: [request_id, certificate, locations]
      properties:
        request_id: { type: string }
        certificate: { $ref: "#/components/schemas/Certificate" }
        locations:
          type: array
          items: { $ref: "#/components/schemas/CertificateLocation" }
    Healthz:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [up, down]
    Role:
      type: string
      description: 기본 역할 6종 (00-spec 7.11)
      enum:
        - system_administrator
        - pki_administrator
        - security_administrator
        - operator
        - auditor
        - viewer
    User:
      type: object
      description: 로컬 계정. password_hash는 어떤 응답에도 포함되지 않는다.
      required: [id, username, role, auth_provider, is_active]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        auth_provider: { type: string, description: "MVP는 local. LDAP/AD/OIDC/SAML 확장점." }
        is_active: { type: boolean }
        department_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScanRequest:
      type: object
      description: 네트워크 TLS 스캔 입력 (00-spec 7.1)
      required: [targets]
      properties:
        targets:
          type: array
          description: IP 또는 CIDR 목록 (예 "10.0.0.5", "10.0.0.0/24")
          items: { type: string }
        ports:
          type: array
          description: 스캔할 포트 목록. 미지정 시 [443].
          items: { type: integer, minimum: 1, maximum: 65535 }
        timeout_ms:
          type: integer
          description: 엔드포인트별 타임아웃(ms). 미지정 시 기본값으로 클램프(100~30000).
        concurrency:
          type: integer
          description: 동시 연결 수. 미지정 시 기본값으로 클램프(1~256).
    ScanAccepted:
      type: object
      required: [job_id, status, total_endpoints]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
        total_endpoints:
          type: integer
          description: 펼쳐진 (IP, 포트) 조합 수
        request_id: { type: string }
    ScanJob:
      type: object
      description: 스캔 Job 상태·진행률·결과 요약
      required:
        [id, status, targets, ports, total_endpoints, scanned_endpoints,
         reachable_endpoints, certificates_found, certificates_new, created_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, running, completed, failed]
        targets:
          type: array
          items: { type: string }
        ports:
          type: array
          items: { type: integer }
        timeout_ms:
          type: integer
          description: 요청 입력 원문. 0 = 서버 기본값 적용(클램프 규칙 100~30000ms).
        concurrency:
          type: integer
          description: 요청 입력 원문. 0 = 서버 기본값 적용(클램프 규칙 1~256).
        total_endpoints: { type: integer }
        scanned_endpoints: { type: integer }
        reachable_endpoints:
          type: integer
          description: TLS 핸드셰이크에 성공해 인증서를 수집한 엔드포인트 수
        certificates_found:
          type: integer
          description: 수집된 인증서 총 개수(중복 포함)
        certificates_new:
          type: integer
          description: fingerprint 신규로 인벤토리에 추가된 인증서 수
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      description: 통일 오류 응답 (00-spec 13장)
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }
