openapi: "3.0.3"
info:
  title: INHERIT_AutoCert API
  description: >
    폐쇄망·레거시 환경용 온프레미스 인증서 라이프사이클 관리(CLM) 플랫폼 API.
    Phase 1(인증서 인벤토리) 범위. 엔드포인트는 구현과 함께 추가한다.
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: 로컬 개발 (docker compose)
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 서버·DB 헬스체크
      description: 서버 생존 여부와 PostgreSQL 연결 상태(ping)를 반환한다.
      tags: [system]
      responses:
        "200":
          description: 서버와 DB 모두 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
              example:
                status: ok
                database: up
        "503":
          description: DB 연결 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
              example:
                status: unavailable
                database: down
  /api/v1/certificates/import:
    post:
      operationId: importCertificates
      summary: 인증서 파일 업로드 (수동 등록)
      description: >
        PEM(체인 포함) 또는 DER 인증서를 업로드한다. SHA-256 fingerprint 기준으로
        중복을 판정해, 중복이면 새 Certificate를 만들지 않고 설치 위치만 추가한다.
        개인키가 포함된 업로드는 저장 없이 거부한다. 모든 요청은 감사 이벤트를 남긴다.
        허용 역할은 system_administrator·pki_administrator·operator다.
      tags: [certificates]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: 새 인증서가 1개 이상 등록됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "200":
          description: 전부 중복 — Certificate는 그대로, 설치 위치만 추가됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: >
            잘못된 업로드. code는 invalid_upload / empty_upload /
            private_key_rejected / invalid_certificate 중 하나.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: 저장 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/certificates:
    get:
      operationId: listCertificates
      summary: 인증서 목록 (검색·필터·정렬·페이지네이션)
      description: >
        인벤토리 인증서 목록을 조회한다. 인증된 전 역할(6종) 접근 가능.
        만료 관련 필터(expired, expires_within_days)는 저장된 status가 아니라
        not_after에서 파생 계산한다. 각 원소에는 조회 시점에 계산한 위험 판정(risk)이
        함께 실리며 risk·risk_code로 거를 수 있다 — 판정은 저장하지 않는다.
        읽기 전용이라 감사 이벤트를 남기지 않는다.
      tags: [certificates]
      parameters:
        - name: q
          in: query
          description: CN·Subject DN·Issuer DN·Serial·Fingerprint·SAN 부분 일치 검색 (대소문자 무시, 200자 이하)
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          description: 상태 필터. 반복 지정 또는 쉼표 구분 다중 값 허용.
          schema:
            type: string
            enum: [active, expired, revoked, replaced, unknown]
        - name: exclude_status
          in: query
          description: >
            결과에서 뺄 상태. 반복 지정 또는 쉼표 구분 다중 값 허용.
            **지정하지 않으면 아무것도 제외하지 않는다** — 서버 기본 동작은 그대로다.
            교체된 인증서 숨기기(exclude_status=replaced)는 호출자가 명시적으로 요청한다
            (06-rescan-and-replacement 11.2).
          schema:
            type: string
            enum: [active, expired, revoked, replaced, unknown]
        - name: type
          in: query
          description: 인증서 유형 필터. 반복 지정 또는 쉼표 구분 다중 값 허용.
          schema:
            type: string
            enum: [server, client, ca, code_signing, email, other]
        - name: expired
          in: query
          description: not_after 기준 만료 여부 (파생 필터)
          schema: { type: boolean }
        - name: expires_within_days
          in: query
          description: 오늘부터 N일 이내 만료 예정 (이미 만료된 것 제외)
          schema: { type: integer, minimum: 1, maximum: 3650 }
        - name: self_signed
          in: query
          description: 자체 서명 여부 (subject_dn = issuer_dn 파생 필터)
          schema: { type: boolean }
        - name: unowned
          in: query
          description: 소유자 미지정 여부 (owner_id IS NULL 파생 필터)
          schema: { type: boolean }
        - name: issuer_org
          in: query
          description: >
            발급 기관(issuer_organization) 정확 일치 필터. 발급 기관 분포
            (GET /certificates/issuers)에서 항목을 클릭해 들어오는 경로다.
            파라미터가 존재하며 빈 값이면 "조직 미상"(issuer_organization
            IS NULL) 필터로 동작하고, 파라미터 부재만 필터 없음이다.
          schema: { type: string, maxLength: 200 }
        - name: issued_by
          in: query
          description: >
            지정한 CA 인증서가 발급한 인증서만 반환한다(값은 발급자 인증서 id).
            매칭은 상세 응답 chain과 같은 규칙 — SKI=AKI 정확 일치 우선,
            키 식별자가 없는 데이터는 issuer_dn = subject_dn 폴백.
          schema: { type: string, format: uuid }
        - name: risk
          in: query
          description: >
            위험 판정 **최고 심각도** 필터. 반복 지정 또는 쉼표 구분 다중 값 허용.
            최고 심각도 기준이므로 네 값이 인벤토리를 겹침 없이 나눈다 — danger는
            "danger 항목이 하나라도 있는" 인증서이고 warn은 "warn은 있지만 danger는
            없는" 인증서다. ok는 위험 항목이 하나도 없다는 뜻이다.
            집계(GET /certificates/risks)의 severities에서 클릭해 들어오는 경로다.
            **여기의 risk는 판정 심각도이며 만료 임박도가 아니다** —
            GET /servers의 sort=risk(=min(not_after))와는 다른 축이다.
          schema:
            type: string
            enum: [danger, warn, info, ok]
        - name: risk_code
          in: query
          description: >
            판정 항목 코드 필터(해당 항목이 잡힌 인증서). 반복 지정 또는 쉼표 구분
            다중 값 허용이며 여러 개면 OR다. 코드 목록은 GET /certificates/risks의
            findings가 건수 0인 항목까지 포함해 내려준다. risk와 함께 주면 AND로 겹친다.
          schema:
            type: string
            enum: [weak_key, key_deprecated_2030, key_strong, ed25519_key,
                   weak_signature, no_san, wildcard, wildcard_broad,
                   wildcard_multi_label, long_validity, expired_ca, self_signed,
                   chain_anomaly, legacy_tls, incomplete_chain]
        - name: sort
          in: query
          description: 정렬 필드 (기본 not_after)
          schema:
            type: string
            enum: [not_after, not_before, common_name, created_at, updated_at,
                   status, certificate_type, public_key_size]
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 인증서 목록 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateList"
        "400":
          description: 잘못된 쿼리 파라미터. code는 invalid_* 형태.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/certificates/summary:
    get:
      operationId: getCertificateSummary
      summary: 대시보드 요약 집계 (만료 구간·자체 서명·소유자 없음)
      description: >
        인벤토리 전체 요약을 반환한다. 만료 구간(7/30/60/90일)은 not_after 파생 계산의
        누적값이며 이미 만료된 것은 제외한다. 인증된 전 역할(6종) 접근 가능. 읽기 전용이라
        감사 이벤트를 남기지 않는다.
      tags: [certificates]
      responses:
        "200":
          description: 요약 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/certificates/issuers:
    get:
      operationId: getCertificateIssuers
      summary: 발급 기관 분포·CA 트리 집계
      description: >
        organizations는 발급 기관(issuer_organization)별 비-CA 인증서 분포이고
        ca_tree는 보유 CA의 N계층 트리다 — 중간 CA의 중간 CA도 평탄화하지 않고
        제 부모 아래에 그대로 중첩된다(노드별 직접 발급 리프 수 leaf_count, 하위
        전체 합산 subtree_leaf_count, 계층 depth 포함).
        리프(비-CA 인증서)는 노드당 최대 5건만 leaf_preview로 싣는다 — 만료 임박순이며
        leaf_count가 leaf_preview 길이보다 크면 나머지가 있다는 뜻이다. 전체 리프는
        트리 노드의 id를 목록 API의 issued_by= 필터에 넣어 페이지네이션과 함께
        조회한다 — 두 API가 같은 매칭 술어를 쓰므로 leaf_count와 목록 건수가 일치한다.
        status=replaced 인증서는 리프 수·미리보기·분포에서 제외한다
        (대시보드 요약과 같은 규약). 인증된 전 역할(6종) 접근 가능. 읽기 전용이라
        감사 이벤트를 남기지 않는다.
      tags: [certificates]
      responses:
        "200":
          description: 발급 기관 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/certificates/risks:
    get:
      operationId: getCertificateRisks
      summary: 위험 판정 집계 (최고 심각도별·판정 항목별 건수)
      description: >
        인벤토리 전체의 위험 판정을 집계한다. **판정은 저장하지 않고 요청마다
        계산한다** — 판정 기준선이 2027·2030에 움직이므로(NIST IR 8547, CA/B Forum
        수명 단축 일정) 저장하면 낡는다. 만료 판정을 not_after에서 파생 계산하는 것과
        같은 규약이다.
        severities는 최고 심각도 기준 분할이라 count의 합이 total과 같고,
        findings는 항목별 건수라 인증서 1건이 여러 항목에 걸려 합이 total과 다르다.
        findings는 건수 0인 항목까지 카탈로그 순서 그대로 내려준다(화면 목록이
        데이터에 따라 흔들리지 않게).
        severities의 severity를 목록 API의 risk=에, findings의 code를 risk_code=에
        넣으면 해당 인증서 목록으로 이동한다 — 두 API가 같은 술어를 쓴다.
        집계는 status=replaced를 제외하므로(대시보드 요약과 같은 규약) 목록으로
        이동할 때 exclude_status=replaced를 함께 보내야 숫자가 맞는다.
        이번 판정 항목은 전부 사설 PKI에도 유효한 것뿐이다 — 공인(publicly trusted)
        인증서 전용 규칙은 포함하지 않는다(public_trust_only 필드가 그 구분 자리다).
        인증된 전 역할(6종) 접근 가능. 읽기 전용이라 감사 이벤트를 남기지 않는다.
      tags: [certificates]
      responses:
        "200":
          description: 위험 판정 집계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateRisks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/certificates/export:
    get:
      operationId: exportCertificates
      summary: 인증서 인벤토리 CSV 내보내기 (목록 조회 조건 기반)
      description: >
        목록과 같은 검색·필터·정렬 조건으로 인벤토리 전체를 CSV로 내려받는다
        (페이지네이션 없음, 최대 50000행). 인벤토리 전체 반출 경로이므로 목록 조회와
        달리 System Administrator·PKI Administrator만 호출할 수 있다 (00-spec 7.11
        인증서 관리 권한) — 나머지 4역할은 403이며 authz.denied 감사가 남는다.
        허용 역할이어도 모든 호출이 certificate.export 감사 이벤트를 남긴다
        (00-spec 7.12 "데이터 내보내기") — 감사 기록 실패 시 내보내기도 실패한다.
        응답은 인벤토리 메타데이터뿐이며 인증서 원문(PEM/DER)·개인키는 포함되지 않는다.
      tags: [certificates]
      parameters:
        - name: q
          in: query
          description: CN·Subject DN·Issuer DN·Serial·Fingerprint·SAN 부분 일치 검색 (대소문자 무시, 200자 이하)
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          description: 상태 필터. 반복 지정 또는 쉼표 구분 다중 값 허용.
          schema:
            type: string
            enum: [active, expired, revoked, replaced, unknown]
        - name: exclude_status
          in: query
          description: >
            결과에서 뺄 상태(목록과 같은 의미). 지정하지 않으면 아무것도 제외하지 않는다 —
            내보내기 기본 내용은 바뀌지 않는다. 지정하면 그 조건이 certificate.export
            감사 이벤트의 exclude_statuses에 함께 기록된다.
          schema:
            type: string
            enum: [active, expired, revoked, replaced, unknown]
        - name: type
          in: query
          description: 인증서 유형 필터. 반복 지정 또는 쉼표 구분 다중 값 허용.
          schema:
            type: string
            enum: [server, client, ca, code_signing, email, other]
        - name: expired
          in: query
          schema: { type: boolean }
        - name: expires_within_days
          in: query
          schema: { type: integer, minimum: 1, maximum: 3650 }
        - name: self_signed
          in: query
          schema: { type: boolean }
        - name: unowned
          in: query
          schema: { type: boolean }
        - name: issuer_org
          in: query
          description: 발급 기관 정확 일치 필터 (목록과 같은 의미 — 빈 값은 조직 미상)
          schema: { type: string, maxLength: 200 }
        - name: issued_by
          in: query
          description: 지정한 CA 인증서가 발급한 인증서만 (목록과 같은 의미)
          schema: { type: string, format: uuid }
        - name: risk
          in: query
          description: >
            위험 판정 최고 심각도 필터 (목록과 같은 의미). 행 수를 바꾸므로
            certificate.export 감사 이벤트의 risk_severities에 함께 기록된다.
          schema:
            type: string
            enum: [danger, warn, info, ok]
        - name: risk_code
          in: query
          description: >
            판정 항목 코드 필터 (목록과 같은 의미). certificate.export 감사 이벤트의
            risk_codes에 함께 기록된다. CSV 열에는 판정 결과가 실리지 않는다 —
            판정은 조회 시점 계산값이라 파일로 굳히면 낡는다.
          schema:
            type: string
            enum: [weak_key, key_deprecated_2030, key_strong, ed25519_key,
                   weak_signature, no_san, wildcard, wildcard_broad,
                   wildcard_multi_label, long_validity, expired_ca, self_signed,
                   chain_anomaly, legacy_tls, incomplete_chain]
        - name: sort
          in: query
          description: 정렬 필드 (기본 not_after)
          schema:
            type: string
            enum: [not_after, not_before, common_name, created_at, updated_at,
                   status, certificate_type, public_key_size]
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: >
            CSV 파일 (UTF-8 BOM 포함, Content-Disposition attachment).
            열: id, common_name, subject_dn, issuer_dn, serial_number,
            fingerprint_sha256, sans(공백 구분), not_before, not_after,
            public_key_algorithm, public_key_size, signature_algorithm,
            certificate_type, status, environment, auto_renew, created_at, updated_at.
          content:
            text/csv:
              schema: { type: string }
        "400":
          description: 잘못된 쿼리 파라미터. code는 invalid_* 형태.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: 조회 또는 감사 기록 실패 (감사 없이는 내보내지 않는다)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/certificates/{id}:
    get:
      operationId: getCertificate
      summary: 인증서 상세 (설치 위치 목록 + 체인 포함)
      description: |
        인증된 전 역할(6종) 접근 가능. 응답에 인증서 원문(PEM/DER)은 포함되지 않는다.
        chain은 자신→상위→루트 순의 발급자 관계 배열이다. 상위 매칭은 AKI = SKI
        정확 일치 우선, 키 식별자가 없는 데이터(0008 이전)는 issuer_dn = subject_dn
        폴백이다. 인벤토리에 없는 상위는 stored=false 항목으로 표시된다.
        risk는 조회 시점에 계산한 위험 판정이며 저장 컬럼이 아니다 — 상세는 위치
        배열을 가지고 있으므로 위치 축(scope=location) 판정도 함께 실린다.
      tags: [certificates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 인증서 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 해당 id의 인증서 없음 (잘못된 uuid 형식 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/servers:
    get:
      operationId: listServers
      summary: 서버(엔드포인트) 축 목록 — 호스트 1행
      description: |
        같은 인증서가 여러 서버에 배포되어 있으면 그중 곧 만료인 서버도 있고 아닌
        서버도 있다. 인증서 목록(GET /certificates)은 인증서 1행이라 이 관계를
        뭉갠다 — 이 API는 같은 인벤토리를 호스트 1행으로 되짚는다.

        행 단위는 targets 1행 = (executor_scope, ip_address)다. 다중 세그먼트에서
        사설 IP가 겹칠 수 있어 scope가 호스트 동일성의 일부다(0010).

        엔드포인트 집합은 "제거되지 않은 network_endpoint 위치 + 은퇴하지 않은
        재스캔 모니터"의 합집합이고, 각 엔드포인트의 현재 인증서는 2단으로 정한다 —
        endpoint_monitors.current_fingerprint가 있으면 관측 확정, 없으면(재스캔 OFF
        이거나 아직 미실행) 가장 최근 확인된 live 위치로 **추정**한다. 추정으로
        채워진 엔드포인트 수는 estimated_count로 내려간다(화면의 '추정' 배지 근거).

        전 엔드포인트를 목록에 싣는 옵션은 두지 않는다 — 확장은 GET /servers/{id}
        지연 로드이고 목록에는 포트 미리보기 5개만 담는다. 인증된 전 역할(6종)
        접근 가능하며 읽기 전용이라 감사 이벤트를 남기지 않는다.
      tags: [certificates]
      parameters:
        - name: q
          in: query
          description: 호스트명·IP·현재 인증서 CN 부분 일치 (대소문자 무시)
          schema: { type: string, maxLength: 200 }
        - name: expired
          in: query
          description: >
            EXISTS 의미다 — true면 이미 만료된 인증서가 하나라도 붙어 있는 서버,
            false면 하나도 없는 서버.
          schema: { type: boolean }
        - name: expires_within_days
          in: query
          description: >
            EXISTS 의미다 — 오늘부터 N일 이내 만료가 하나라도 있는 서버
            (이미 만료된 것은 제외).
          schema: { type: integer, minimum: 1, maximum: 3650 }
        - name: scope
          in: query
          description: targets.executor_scope 정확 일치 — server 또는 sensor:&lt;센서 id&gt;
          schema: { type: string }
        - name: mismatch
          in: query
          description: >
            true면 구버전 잔존이 있는 서버만 — 현재 인증서와 다른 위치 행이
            아직 남아 있다(교체 후 옛 인증서가 어딘가 붙어 있음).
          schema: { type: boolean }
        - name: sort
          in: query
          description: >
            정렬 필드 (기본 risk). risk는 min(not_after) 오름차순이고 만료 시각을
            모르는 서버는 방향과 무관하게 뒤로 보낸다(NULLS LAST).
            **여기의 risk는 만료 임박도(min(not_after))일 뿐 인증서 위험 판정이 아니다** —
            GET /certificates의 risk= 필터가 쓰는 심각도(danger/warn/info/ok)와는 다른 축이다.
          schema:
            type: string
            enum: [risk, hostname, endpoints, certificates, last_seen]
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 서버 목록 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerList"
        "400":
          description: 잘못된 쿼리 파라미터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/servers/{id}:
    get:
      operationId: getServer
      summary: 서버 상세 (포트별 엔드포인트 확장)
      description: >
        목록 1행과 같은 서버 요약 + 포트별 엔드포인트 배열이다. 각 엔드포인트는
        지금 붙어 있다고 판정한 인증서와 그 판정이 추정인지 여부
        (certificate_estimated), 재스캔 관측값(last_success_at·last_probe_at·
        consecutive_misses·retired_at), 그리고 구버전 잔존 위치(stale_locations)를
        담는다. 인증된 전 역할(6종) 접근 가능, 읽기 전용이라 감사 이벤트 없음.
      tags: [certificates]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 서버 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 해당 id의 서버 없음 (잘못된 uuid 형식 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      summary: 초기 설정 필요 여부
      description: >
        사용자가 0명이면 setup_required=true다. 계정이 1명이라도 있으면 false가 되고
        이후 영구히 false다 — 초기 설정 화면·엔드포인트가 닫혔다는 뜻이다.
        인증 없이 호출되므로 응답에는 불리언 1개만 담는다(계정 수·계정명 비노출).
      tags: [setup]
      security: []
      responses:
        "200":
          description: 초기 설정 필요 여부
          content:
            application/json:
              schema:
                type: object
                required: [setup_required]
                properties:
                  setup_required: { type: boolean }
  /api/v1/setup/admin:
    post:
      operationId: createInitialAdmin
      summary: 최초 System Administrator 생성 (초기 설정)
      description: >
        첫 접속 시 브라우저에서 관리자 계정을 만든다. 사용자가 0명일 때만 동작하며
        생성 여부는 DB가 원자적으로 판정한다 (advisory lock 직렬화 +
        INSERT … WHERE NOT EXISTS). 이미 계정이 있으면 409다.
        비밀번호 정책은 일반 사용자 생성과 동일하고(최소 12자·최대 72바이트·계정명과 상이),
        생성은 감사 이벤트(user.created, source=initial_setup)를 남긴다.
        무인 설치용 BOOTSTRAP_ADMIN_PASSWORD 경로는 그대로 유지된다.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "201":
          description: 최초 관리자 생성됨 (role은 항상 system_administrator)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: 본문 오류·계정명 누락·비밀번호 정책 위반
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 이미 사용자가 존재해 초기 설정이 닫혔음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 로컬 계정 로그인
      description: >
        자격 증명 검증 후 세션 토큰을 발급한다. 응답 본문 token(Bearer용)과
        HttpOnly 쿠키(브라우저용)를 함께 준다. 성공·실패 모두 감사 이벤트를 남긴다.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at, user]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 로그아웃 (세션 폐기)
      tags: [auth]
      responses:
        "204": { description: 세션 폐기 완료 }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: 현재 인증된 사용자 조회
      tags: [auth]
      responses:
        "200":
          description: 현재 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      operationId: listUsers
      summary: 사용자 목록 (System Administrator 전용)
      tags: [users]
      responses:
        "200":
          description: 사용자 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  total: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUser
      summary: 사용자 생성 (System Administrator 전용)
      description: >
        비밀번호 정책(12자 이상, username과 상이)을 검사한다. 감사 이벤트를 남긴다.
        모르는 필드가 오면 400(invalid_body)이다 — 조용히 버리지 않는다.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 12 }
                display_name: { type: string, nullable: true }
                role: { $ref: "#/components/schemas/Role" }
                email:
                  type: string
                  format: email
                  nullable: true
                  maxLength: 254
                  description: >
                    알림 메일 수신 주소. 빈 문자열은 null과 같게 취급한다.
                    local@domain 형식이 아니면 400(invalid_email)이다.
      responses:
        "201":
          description: 생성된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: 비밀번호 정책 위반, 잘못된 역할, 잘못된 메일 주소(invalid_email), 알 수 없는 필드
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: username 중복
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/users/{id}:
    patch:
      operationId: updateUser
      summary: 사용자 수정 (System Administrator 전용)
      description: >
        role·display_name·email을 부분 수정한다. 제공한 필드만 바뀌며, display_name·email에
        null(또는 email은 빈 문자열)을 보내면 값을 지운다.
        user.update 감사 이벤트를 같은 트랜잭션으로 남긴다.
        락아웃 방지: 자기 역할 변경과 마지막 활성 System Administrator 강등은 409로 거부한다.
        모르는 필드가 오면 400(invalid_body)이다.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                role: { $ref: "#/components/schemas/Role" }
                display_name: { type: string, nullable: true }
                email: { type: string, format: email, nullable: true, maxLength: 254 }
      responses:
        "200":
          description: 수정된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: >
            잘못된 역할, 잘못된 메일 주소, 수정할 필드 없음
            (invalid_role·invalid_email·no_fields)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 락아웃 방지 거부 (self_role_change_forbidden·last_admin_protected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/users/{id}/disable:
    post:
      operationId: disableUser
      summary: 사용자 비활성화 (System Administrator 전용)
      description: >
        is_active를 false로 바꾸고 해당 사용자의 활성 세션을 같은 트랜잭션에서 전부
        폐기한다 — 퇴사자 차단이 즉시 발효된다. user.disable 감사 이벤트를 남긴다.
        락아웃 방지: 자기 계정과 마지막 활성 System Administrator는 409로 거부한다.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 비활성화된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 락아웃 방지 거부 (self_disable_forbidden·last_admin_protected)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/users/{id}/enable:
    post:
      operationId: enableUser
      summary: 사용자 활성화 (System Administrator 전용)
      description: is_active를 true로 되돌린다. user.enable 감사 이벤트를 남긴다.
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 활성화된 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/users/{id}/password:
    post:
      operationId: resetUserPassword
      summary: 비밀번호 재설정 (System Administrator 전용)
      description: >
        관리자가 대상 사용자의 비밀번호를 재설정한다. 비밀번호 정책(12자 이상,
        username과 상이)을 검사하며, 성공 시 대상의 활성 세션을 전부 폐기한다.
        user.password.reset 감사 이벤트를 남긴다 — 감사 payload에 비밀번호·해시는 없다.
        응답 본문은 없다(204).
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, format: password, minLength: 12 }
      responses:
        "204": { description: 재설정 완료 (세션 폐기됨) }
        "400":
          description: 비밀번호 정책 위반 (weak_password)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 사용자
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/scans:
    post:
      operationId: createDiscoveryScan
      summary: 네트워크 TLS 스캔 시작 (비동기)
      description: >
        IP/CIDR 목록과 포트로 에이전트리스 TLS 스캔 Job을 만든다. 즉시 job_id를 반환하고(202)
        실제 스캔은 백그라운드에서 돈다. 도달 가능한 TLS 엔드포인트의 인증서를 fingerprint
        기준으로 중복 판정해 인벤토리에 저장한다. 자기서명·만료 인증서도 수집한다(수집 전용,
        검증하지 않음). 생성·완료는 감사 이벤트를 남긴다.


        총 엔드포인트 수(IP 수 × 포트 수)가 임계(SCAN_SWEEP_CHUNK_ENDPOINTS, 기본 4096)를
        넘으면 **스윕으로 자동 승격**한다 — 즉시 스캔의 응답성을 지키기 위함이며,
        그때 응답은 mode=sweep·promoted=true·sweep_id다(감사도 discovery.sweep에
        promoted=true로 남는다). 레이트·청크·ETA 상한은 스윕 경로 그대로다.
        발주 전에 크기·소요를 보려면 POST /discovery/scans/preview를 쓴다.
        허용 역할은 system_administrator·pki_administrator·operator다.
      tags: [discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "202":
          description: >
            스캔 Job 생성됨 (백그라운드 실행). 임계를 넘은 요청은 스윕으로 승격되어
            mode=sweep·sweep_id로 답한다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanAccepted" }
        "400":
          description: 잘못된 대상·포트 또는 범위 초과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            동일 정규화 요청(실행기·대상·포트)이 이미 활성(pending/leased/running)이다
            (duplicate_scan — 버튼 연타 가드). job_id가 기존 활성 Job을 가리킨다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateScan" }
        "422":
          description: >
            sensor_id가 존재하지 않거나 active 상태가 아닌 센서(invalid_sensor), 또는
            스윕으로 승격된 요청의 예상 소요가 상한을 넘음(sweep_too_long — 메시지에
            실제 일수 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listDiscoveryScans
      summary: 스캔 Job 목록 조회 (상태·출처 필터·페이지네이션)
      description: >
        최신 생성 순. 스윕 청크·재스캔 발주도 scan_jobs 행이므로 함께 나온다 —
        origin으로 구분한다. 읽기 전용 — 전 역할, 감사 이벤트 없음.
      tags: [discovery]
      parameters:
        - name: status
          in: query
          description: pending/leased/running/completed/failed/canceled (반복·쉼표 구분 허용)
          schema: { type: string }
        - name: origin
          in: query
          description: manual/sweep/rescan (반복·쉼표 구분 허용)
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 스캔 Job 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJobList" }
        "400":
          description: 잘못된 쿼리 파라미터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/discovery/scan-suggestions:
    get:
      operationId: getScanSuggestions
      summary: 스캔 대상 제안 (최근 사용·파생 대역·운영자 지정 대역)
      description: >
        수기 CIDR 입력을 줄이기 위한 제안 3종 — 최근 수동 스캔의 대상 원문(최근 사용 순),
        발견된 네트워크 대상의 IPv4 주소를 /24로 묶은 파생 대역(대상 수 내림차순),
        SCAN_SUGGESTED_NETWORKS 운영자 지정 대역. 제안일 뿐 스캔 범위를 제한하지
        않는다. 읽기 전용 — 전 역할, 감사 이벤트 없음.
      tags: [discovery]
      responses:
        "200":
          description: 스캔 대상 제안
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanSuggestions" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/discovery/scans/preview:
    post:
      operationId: previewDiscoveryScan
      summary: 스캔 미리보기 (대상·포트 파싱 + 승격 판정 + 예상 소요)
      description: >
        아무것도 만들지 않고 스캔 요청을 서버 파서로 펼쳐 본다 — 개별 IP 수, 포트 수,
        총 엔드포인트 수, 단발/스윕 승격 여부, 적용될 레이트와 예상 소요다.
        발주(POST /discovery/scans)와 **같은 함수**가 계산하므로 여기 보인 숫자가
        실제로 도는 작업과 같다. 포트·IP 파서는 서버 한 곳이 정본이며 클라이언트는
        추정기를 갖지 않는다. 예상 소요가 상한(SCAN_SWEEP_MAX_DAYS)을 넘으면 거부하지
        않고 too_long=true와 사유 문구로 알린다 — 그래야 발주 전에 범위를 줄일 수 있다.
        조회이므로 감사 이벤트를 남기지 않는다. GET이 아니라 POST인 이유는 대상 목록이
        URL 길이 상한을 넘기 때문이다. 허용 역할은 발주와 같은
        system_administrator·pki_administrator·operator다 — 스캔을 만들 수 없는 역할에게
        발주 폼의 사전 계산만 열어 줄 이유가 없다. sensor_id는 크기·소요에 영향이 없어
        여기서는 검증하지 않는다.
      tags: [discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanRequest" }
      responses:
        "200":
          description: 파싱·승격 판정 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanPreview" }
        "400":
          description: 잘못된 대상·포트 사양 (발주와 같은 파서·같은 메시지)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/discovery/activity:
    get:
      operationId: listDiscoveryActivity
      summary: 통합 작업 목록 (스캔 Job + 스윕 + 정기 스캔 실행)
      description: >
        세 축을 최신순 한 목록으로 합쳐 내려준다. **자동 발주의 개별 Job은 싣지
        않는다** — 주기 재스캔 Job(origin=rescan)과 스윕 자식 청크(origin=sweep)는
        목록을 도배하므로 제외하고, 정기 스캔이 발주한 스윕은 그 실행 행 1줄이
        대표한다. 취소 가능 여부는 서버가 cancel 필드로 판정해 내려준다 —
        클라이언트가 상태 문자열로 추론하면 상태 머신이 바뀔 때 조용히 어긋난다.
        읽기 전용 — 전 역할, 감사 이벤트 없음.
      tags: [discovery]
      parameters:
        - name: kind
          in: query
          description: scan/sweep/schedule_run (반복·쉼표 구분 허용)
          schema: { type: string }
        - name: active
          in: query
          description: true면 아직 끝나지 않은 작업만
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 통합 작업 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityList" }
        "400":
          description: 잘못된 쿼리 파라미터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/discovery/defaults:
    get:
      operationId: getDiscoveryDefaults
      summary: 스캔·스윕 기본값과 상한 (환경변수 반영 유효값)
      description: >
        SCAN_SWEEP_* 환경변수가 반영된 **실제 유효값**이다. 화면이 기본값을 상수로
        들고 있으면 환경변수를 바꾼 현장에서 placeholder가 거짓말한다. 단발 스캔의
        프로브 속도는 요청으로 바꿀 수 없는 내부 상수라 싣지 않는다.
        읽기 전용 — 전 역할, 감사 이벤트 없음.
      tags: [discovery]
      responses:
        "200":
          description: 기본값·상한
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryDefaults" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/discovery/scans/{id}:
    get:
      operationId: getDiscoveryScan
      summary: 스캔 Job 상태·진행률·결과 요약 조회
      tags: [discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 스캔 Job 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/scans/{id}/cancel:
    post:
      operationId: cancelDiscoveryScan
      summary: 스캔 Job 취소
      description: >
        pending은 즉시 취소하고, 서버 실행 running은 실행 goroutine의 ctx를 끊는다.
        센서가 이미 집어간 작업(leased/running)은 409다 — 센서를 실제로 멈출 수 없어
        "취소됐는데 계속 도는" 거짓 상태를 만들지 않는다. 스윕이 발주한 청크도 409 —
        스윕 pause/cancel로만 제어한다. discovery.scan.cancel 감사 이벤트를 상태
        전이와 같은 트랜잭션으로 남긴다. 허용 역할은
        system_administrator·pki_administrator·operator다.
      tags: [discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 취소된 스캔 Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanJob" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            취소할 수 없는 상태(scan_state — 종료됨·센서 실행 중) 또는 스윕 자식
            청크(sweep_chunk)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/sweeps:
    post:
      operationId: createDiscoverySweep
      summary: 전 포트 백그라운드 스윕 시작 (비동기, 장기 실행)
      description: >
        대상 대역을 낮은 레이트로 며칠에 걸쳐 도는 스윕을 만든다. 즉시 sweep_id를
        반환하고(202) 청크(자식 스캔 Job)는 백그라운드 발주자가 순차로 내보낸다.
        예상 소요가 SCAN_SWEEP_MAX_DAYS(기본 30일)를 넘으면 422로 거부하며
        메시지에 **실제 소요 일수**를 담는다 — 대역·포트 범위를 얼마나 줄여야
        하는지 알 수 있어야 한다. 생성은 discovery.sweep 감사 이벤트를 남긴다.
        허용 역할은 system_administrator·pki_administrator·operator다.
      tags: [discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SweepRequest" }
      responses:
        "202":
          description: 스윕 생성됨 (백그라운드 발주)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SweepAccepted" }
        "400":
          description: 잘못된 대상·포트 사양
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            예상 소요가 상한을 넘음(sweep_too_long — 메시지에 실제 일수 포함)
            또는 sensor_id가 존재하지 않거나 active가 아님(invalid_sensor)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listDiscoverySweeps
      summary: 스윕 목록 조회 (상태 필터·페이지네이션)
      description: 최신 생성 순. 진행률은 자식 Job 집계로 파생한다. 읽기 전용 — 전 역할.
      tags: [discovery]
      parameters:
        - name: status
          in: query
          description: queued/running/paused/completed/failed/canceled (반복·쉼표 구분 허용)
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 스윕 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SweepList" }
        "400":
          description: 잘못된 쿼리 파라미터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/discovery/port-presets:
    get:
      operationId: listPortPresets
      summary: 포트 프리셋 목록 (web/common/all)
      description: >
        포트 사양 파서가 쓰는 프리셋의 단일 진실원천이다. all은 목록이 6.5만 개라
        ports를 생략하고 count만 내려준다. 읽기 전용 — 전 역할.
      tags: [discovery]
      responses:
        "200":
          description: 프리셋 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortPresetList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/discovery/sweeps/{id}:
    get:
      operationId: getDiscoverySweep
      summary: 스윕 상태·진행률 조회
      tags: [discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 스윕 상태 (진행률 파생값 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sweep" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 스윕
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/sweeps/{id}/pause:
    post:
      operationId: pauseDiscoverySweep
      summary: 스윕 일시 정지 (신규 청크 발주 중단)
      description: >
        이미 나간 청크는 완주한다(취소를 센서까지 전파하지 않는다).
        discovery.sweep 감사 이벤트를 남긴다.
      tags: [discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 전이된 스윕
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sweep" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 스윕
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 현재 상태에서 허용되지 않는 전이
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/sweeps/{id}/resume:
    post:
      operationId: resumeDiscoverySweep
      summary: 스윕 재개 (next_seq부터 발주)
      tags: [discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 전이된 스윕
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sweep" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 스윕
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 현재 상태에서 허용되지 않는 전이
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/sweeps/{id}/cancel:
    post:
      operationId: cancelDiscoverySweep
      summary: 스윕 취소 (발주 영구 중단)
      description: 진행 중 청크의 결과는 정상 반영된다. discovery.sweep 감사 이벤트를 남긴다.
      tags: [discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 전이된 스윕
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sweep" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 스윕
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 현재 상태에서 허용되지 않는 전이
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/rescan/status:
    get:
      operationId: getRescanStatus
      summary: 주기 재스캔 현황 (활성 여부·간격·감시 엔드포인트·적체)
      description: >
        이미 아는 엔드포인트를 주기적으로 다시 확인하는 재스캔의 현황이다
        (06-rescan-and-replacement 11.2). 설정은 환경변수 zero-config이므로 이 API는
        읽기 전용이며 정책 편집 엔드포인트는 없다. 감시 수·적체 수는 저장 컬럼이 아니라
        매 호출마다 파생 집계한다. 읽기 전용이라 감사 이벤트를 남기지 않는다.
        스케줄러가 배선되지 않은 서버에서도 200으로 답하며 wired=false·enabled=false다.
      tags: [discovery]
      responses:
        "200":
          description: 재스캔 현황
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RescanStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/discovery/rescan/run:
    post:
      operationId: runRescanBatch
      summary: 재스캔 1배치 즉시 발주 (due 무시)
      description: >
        주기를 기다리지 않고 지금 1배치를 발주한다. 스캔 발주와 같은 3역할
        (System Administrator·PKI Administrator·Operator)만 호출할 수 있고, 발주된
        스캔 Job마다 discovery.scan 감사 이벤트가 남는다(after_value의 origin=rescan으로
        구분 — 새 이벤트 타입을 만들지 않는다). 요청 본문은 없다.
      tags: [discovery]
      responses:
        "202":
          description: >
            발주 완료. dispatched_* 가 0이면 지금 재확인할 엔드포인트가 없다는 뜻이며
            오류가 아니다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RescanRunResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 재스캔이 설정으로 비활성화됨 (code=rescan_disabled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: 재스캔 스케줄러가 이 서버에 배선되지 않음 (code=rescan_unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/schedules:
    get:
      operationId: listScanSchedules
      summary: 정기 스캔 설정 목록 (전체·사전 설정·등록된 인증서)
      description: >
        정기 스캔 3종의 설정과 실행 문맥이다 (0019). full·registered는 각각 1행이고
        preset은 여러 개다. 읽기 전용 — 전 역할, 감사 이벤트를 남기지 않는다.
        active_run이 있으면 지금 도는 실행이 있다는 뜻이며 '지금 실행'은 409가 된다.
        wired=false면 스케줄러가 배선되지 않아 실행·취소가 503이다(설정 조회·변경은 정상).
      tags: [discovery]
      responses:
        "200":
          description: 정기 스캔 설정 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanScheduleList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateScanSchedule
      summary: 정기 스캔 설정 부분 수정
      description: >
        대상은 id 또는 kind 중 **정확히 하나**로 지목한다 — full·registered는 시드
        1행이라 화면이 id를 몰라도 kind로 집을 수 있고, preset은 N행이라 id로만 집는다.
        보내지 않은 필드는 바뀌지 않으며, interval_seconds·rate_pps는 null을 명시해
        "환경변수 기본값으로 되돌림"을 표현한다. port_spec은 스캔·스윕과 **같은 파서**로
        검증한다. 켜기 전에는 대상·포트가 있어야 하고(registered는 반대로 둘 다 금지),
        full·preset의 주기는 1시간 이상이어야 한다. 꺼져 있던 스케줄을 켜면 다음 실행이
        now()+주기로 새로 잡히고, 켜져 있는 스케줄을 수정해도 예정은 밀리지 않는다.
        스캔 발주와 같은 3역할만 호출할 수 있고 discovery.schedule 감사 이벤트를 남긴다.
      tags: [discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScanScheduleUpdateRequest" }
      responses:
        "200":
          description: 수정된 설정
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanSchedule" }
        "400":
          description: >
            입력 오류 (code=invalid_request | invalid_schedule) — 대상 지목이 없거나
            둘 다이거나, 포트 사양·주기·대상 조합이 kind 규칙을 어긴 경우다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 정기 스캔 설정
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/schedules/{id}/run:
    post:
      operationId: runScanSchedule
      summary: 정기 스캔 지금 실행 (주기를 리셋하지 않는다)
      description: >
        예정된 다음 실행은 그대로 두고 1회만 추가로 실행한다 — 자주 눌러도 원래
        일정이 밀리지 않는다. full·preset은 스윕 1건을 발주하고, registered는 기존
        재스캔 1배치를 발주한 뒤 실행을 즉시 닫는다. 이미 도는 실행이 있으면 409이며
        응답에 그 run_id가 실린다(스케줄당 활성 실행은 1건이라는 구조적 제약).
        스캔 발주와 같은 3역할만 호출할 수 있고 discovery.schedule 감사 이벤트를 남긴다.
        요청 본문은 없다.
      tags: [discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: 실행 1건이 열렸다. 실제 프로브는 백그라운드에서 돈다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanScheduleRun" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 정기 스캔 설정
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 이미 실행 중 (code=schedule_run_active)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanScheduleRunActive" }
        "422":
          description: >
            지금은 실행할 수 없음 (code=schedule_not_runnable) — 대상·포트가 비었거나
            발주할 스윕의 예상 소요가 상한을 넘는 경우다.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: 정기 스캔 스케줄러가 이 서버에 배선되지 않음 (code=schedule_unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/discovery/schedules/runs/{id}/cancel:
    post:
      operationId: cancelScanScheduleRun
      summary: 정기 스캔 실행 취소
      description: >
        발주된 스윕을 먼저 멈추고 실행 이력을 canceled로 닫는다 — 순서가 규약이다.
        스윕을 세우지 않은 채 실행만 닫으면 다음 주기가 열리면서 두 스윕이 겹친다.
        이미 종료된 실행은 409다. 스캔 발주와 같은 3역할만 호출할 수 있고
        discovery.schedule 감사 이벤트를 남긴다. 요청 본문은 없다.
      tags: [discovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 취소된 실행
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanScheduleRun" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 실행
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 이미 종료된 실행 (code=schedule_run_state)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: 정기 스캔 스케줄러가 이 서버에 배선되지 않음 (code=schedule_unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/sensors:
    get:
      operationId: listSensors
      summary: 센서(원격 수집기) 목록 조회
      description: 전체 센서를 최신 생성 순으로 반환한다. 읽기 전용 — 전 역할 허용.
      tags: [sensors]
      responses:
        "200":
          description: 센서 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSensor
      summary: 센서 생성 + 1회용 등록 토큰 발급 (System Administrator 전용)
      description: >
        pending 센서를 만들고 1회용 등록 토큰(24h 유효)을 발급한다. 서버는 토큰의
        SHA-256 해시만 저장하므로 평문 토큰은 **이 응답에서만 1회** 내려온다 (00-spec 7.8).
        센서 mTLS 내부 CA가 아직 없으면 이 시점에 부트스트랩한다(개인키는
        SENSOR_CA_ENC_KEY로 봉인해 저장). 발급은 sensor.token.issue 감사 이벤트를 남긴다.
      tags: [sensors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 센서 표시 이름 (배치 세그먼트 식별용) }
      responses:
        "201":
          description: 센서 생성됨 (등록 토큰 1회 노출)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorCreateResult" }
        "400":
          description: 잘못된 본문 또는 이름 누락
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: 센서 CA 부트스트랩 불가 (SENSOR_CA_ENC_KEY 미설정 등)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/sensors/{id}:
    get:
      operationId: getSensor
      summary: 센서 상세 조회
      tags: [sensors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 센서 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 센서
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/sensors/{id}/disable:
    post:
      operationId: disableSensor
      summary: 센서 비활성화 (System Administrator 전용)
      description: >
        센서를 disabled로 전이한다. pending 센서에 쓰면 미사용 등록 토큰 회수가 된다.
        이후 mTLS 접속·작업 리스가 거부된다. sensor.disable 감사 이벤트를 남긴다.
      tags: [sensors]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 비활성화된 센서
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorDetail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않거나 이미 disabled인 센서
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/admin-ip-rules:
    get:
      operationId: listAdminIPRules
      summary: 관리 콘솔 접근 IP 허용 목록 조회 (System Administrator 전용)
      description: >
        허용 규칙 전체(비활성 포함)와 함께, **서버가 본** 이 요청의 출발지 IP를
        access.client_ip로 돌려준다. 운영자가 자기 IP를 착각해 스스로를 막지 않게 하는
        기준값이다. access에는 대역 문자열 같은 설정값을 싣지 않고 설정 여부만 싣는다.
        활성 규칙이 0건이면 제한 자체가 없다(access.enforced=false).
      tags: [access]
      responses:
        "200":
          description: 허용 규칙 목록 + 현재 접속 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminIPRuleList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAdminIPRule
      summary: 접근 IP 허용 규칙 추가 (System Administrator 전용)
      description: >
        단일 IP는 /32(IPv6는 /128)로 정규화해 저장한다. 호스트 비트가 켜진 CIDR
        (예: 192.168.1.5/24)은 조용히 깎지 않고 400으로 거부한다.
        **이 추가로 요청자 자신이 차단되는 경우 409(self_lockout_forbidden)로 거부한다** —
        판정은 삽입과 같은 트랜잭션 안에서 하므로 동시 요청이 서로를 잠글 수 없다.
        admin_ip_rule.create 감사 이벤트를 같은 트랜잭션으로 남긴다.
        모르는 필드가 오면 400(invalid_body)이다.
      tags: [access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cidr]
              additionalProperties: false
              properties:
                cidr:
                  type: string
                  description: 단일 IP(10.0.0.5) 또는 CIDR 대역(10.0.0.0/24)
                description: { type: string, maxLength: 200 }
                is_active: { type: boolean, default: true }
      responses:
        "201":
          description: 추가된 규칙
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminIPRule" }
        "400":
          description: 잘못된 IP/CIDR(invalid_cidr), 설명 길이 초과, 알 수 없는 필드
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >
            이미 등록된 대역(cidr_taken) / 요청자 자신이 차단됨(self_lockout_forbidden) /
            출발지 IP 판정 불가(client_ip_unknown)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/admin-ip-rules/{id}:
    patch:
      operationId: updateAdminIPRule
      summary: 접근 IP 허용 규칙 활성/비활성 토글 (System Administrator 전용)
      description: >
        비활성화로 요청자 자신이 차단되면 409(self_lockout_forbidden)다. 마지막 활성
        규칙을 끄는 것은 "제한 없음"이 되므로 항상 허용된다 — 잠금이 아니라 해제다.
        admin_ip_rule.update 감사 이벤트를 남긴다.
      tags: [access]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              additionalProperties: false
              properties:
                is_active: { type: boolean }
      responses:
        "200":
          description: 변경된 규칙
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminIPRule" }
        "400":
          description: is_active 누락(no_fields) 또는 알 수 없는 필드
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 규칙
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 요청자 자신이 차단됨(self_lockout_forbidden) / 출발지 IP 판정 불가(client_ip_unknown)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteAdminIPRule
      summary: 접근 IP 허용 규칙 삭제 (System Administrator 전용)
      description: >
        삭제로 요청자 자신이 차단되면 409(self_lockout_forbidden)다.
        admin_ip_rule.delete 감사 이벤트를 남긴다.
      tags: [access]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: 삭제됨 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 규칙
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 요청자 자신이 차단됨(self_lockout_forbidden) / 출발지 IP 판정 불가(client_ip_unknown)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/audit/events:
    get:
      operationId: listAuditEvents
      summary: 감사 로그 조회 (Security Administrator·Auditor 전용)
      description: 사용자(actor_id)·이벤트 유형·기간으로 필터한다. 최신 이벤트 우선.
      tags: [audit]
      parameters:
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: event_type
          in: query
          schema: { type: string, example: user.login }
        - name: from
          in: query
          description: created_at 하한 (RFC3339)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: created_at 상한 (RFC3339)
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 감사 이벤트 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
        "400":
          description: 잘못된 파라미터 (UUID/RFC3339/범위)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/audit/verify:
    get:
      operationId: verifyAuditChain
      summary: 감사 로그 무결성 검증 (Security Administrator·Auditor 전용)
      description: >
        SHA-256 해시 체인 전체를 재계산해 변조 지점을 id 단위로 특정한다.
        hash_mismatch는 행 내용 변조, chain_broken은 직전 행과의 연결 단절(중간 삭제 등)이다.
        꼬리(최신) 이벤트 삭제는 체인만으로 탐지할 수 없으므로 head_hash를 외부 매체에
        주기적으로 기록해 보완한다.
      tags: [audit]
      responses:
        "200":
          description: 체인 검증 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerifyResult" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: 내 알림함 목록 조회
      description: >
        세션 사용자 본인의 알림만 반환한다(쿼리에 user_id를 항상 바인드한다).
        읽기 전용이며 감사 이벤트를 남기지 않는다. 전 역할 허용.
      tags: [notifications]
      parameters:
        - name: status
          in: query
          description: unread(기본) | all(보관 제외 전체) | archived
          schema: { type: string, enum: [unread, all, archived], default: unread }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 알림 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
        "400":
          description: 잘못된 쿼리 파라미터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: 안 읽은 알림 수 (배지용)
      tags: [notifications]
      responses:
        "200":
          description: 안 읽은 알림 수
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  request_id: { type: string }
                  unread: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: 내 알림 모두 읽음 처리
      description: >
        본인 소유 행의 개인적 읽음 상태만 바꾸므로 감사 이벤트를 남기지 않는다
        (설계 05-notifications 12 ① — 승인된 예외).
      tags: [notifications]
      responses:
        "200":
          description: 읽음 처리된 건수
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  request_id: { type: string }
                  updated: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: 알림 1건 읽음 처리
      description: 소유자가 아니면 404다 — 존재 여부를 흘리지 않기 위해 403을 쓰지 않는다.
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: 처리됨 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 없거나 본인 소유가 아닌 알림
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/notifications/{id}/archive:
    post:
      operationId: archiveNotification
      summary: 알림 1건 보관 (읽음도 함께 처리)
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: 처리됨 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 없거나 본인 소유가 아닌 알림
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/notification-policies:
    get:
      operationId: listNotificationPolicies
      summary: 알림 정책 목록 (System/Security Administrator 전용)
      tags: [notifications]
      responses:
        "200":
          description: 정책 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPolicyList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createNotificationPolicy
      summary: 알림 정책 생성
      description: >
        생성과 notification.policy.create 감사 이벤트를 단일 트랜잭션으로 기록한다
        (감사 실패 시 생성도 롤백). 허용 역할은 system_administrator와
        security_administrator다 (00-spec 7.11 "보안 관리자 = 정책 설정").
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPolicyRequest" }
      responses:
        "201":
          description: 생성된 정책
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPolicy" }
        "400":
          description: 잘못된 본문 (이름·사건 종류·임계값·채널·수신자 형식)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 같은 이름의 정책이 이미 있음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/notification-policies/{id}:
    patch:
      operationId: updateNotificationPolicy
      summary: 알림 정책 부분 수정
      description: 지정한 필드만 바꾸고 notification.policy.update 감사를 같은 트랜잭션으로 남긴다.
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPolicyPatch" }
      responses:
        "200":
          description: 수정된 정책
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPolicy" }
        "400":
          description: 잘못된 본문
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 정책
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 같은 이름의 정책이 이미 있음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteNotificationPolicy
      summary: 알림 정책 삭제
      description: >
        notification.policy.delete 감사를 같은 트랜잭션으로 남긴다. 이미 만들어진
        이벤트는 policy_id가 NULL로 남아 이력이 보존된다.
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: 삭제됨 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 정책
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/notification-policies/{id}/test:
    post:
      operationId: testNotificationPolicy
      summary: 정책 채널로 테스트 발송
      description: >
        정책이 쓰는 채널(또는 body.channel 하나)로 테스트 알림을 보내고
        notification.test 감사 이벤트를 남긴다. 비활성 채널은 skipped + 사유로
        답한다. 서버에 알림 발송이 배선되어 있지 않으면 503이다(감사는 남는다).
      tags: [notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [email, webhook, inbox, syslog]
                  description: 비우면 정책의 전 채널을 테스트한다. 정책이 쓰지 않는 채널이면 400.
                recipient:
                  type: string
                  description: 선택. 비우면 채널 구현이 기본 수신자를 고른다.
      responses:
        "200":
          description: 채널별 테스트 결과
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTestResult" }
        "400":
          description: 잘못된 본문 또는 정책이 쓰지 않는 채널
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: 존재하지 않는 정책
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: 이 서버에 알림 발송이 배선되지 않음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/notification-channels:
    get:
      operationId: listNotificationChannels
      summary: 알림 채널 상태 (설정값은 노출하지 않는다)
      description: >
        응답은 {channel, enabled, reason}뿐이다. 호스트·계정·비밀번호·웹훅 URL을
        절대 싣지 않는다 (설계 05-notifications 9.3) — 운영자는 "왜 안 되는지"만
        알면 되고 값은 서버 환경변수에서 확인한다. reason은 기동 경고 로그와
        같은 문자열이다.
      tags: [notifications]
      responses:
        "200":
          description: 채널 상태 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannelList" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      summary: 알림 발송 이력 조회
      description: >
        "왜 안 왔는지"를 답하는 경로라 감사자(auditor)도 열람할 수 있다.
        읽기 전용이며 감사 이벤트를 남기지 않는다.
      tags: [notifications]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, sending, sent, failed, skipped] }
        - name: channel
          in: query
          schema: { type: string, enum: [email, webhook, inbox, syslog] }
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 발송 이력
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDeliveryList" }
        "400":
          description: 잘못된 쿼리 파라미터
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: 이 OpenAPI 명세 원문 조회
      description: >
        서버 바이너리에 임베드된 이 명세(YAML)를 그대로 반환한다.
        폐쇄망 제품이므로 명세도 인증 뒤에 둔다 (전 역할 조회 가능).
        명세와 라우트의 정합은 빌드 시 테스트로 검증된다.
      tags: [system]
      responses:
        "200":
          description: OpenAPI 3 명세 (YAML 원문)
          content:
            application/yaml:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
security:
  - bearerAuth: []
  - cookieAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 로그인 응답의 token
    cookieAuth:
      type: apiKey
      in: cookie
      name: autocert_session
  responses:
    Unauthorized:
      description: 인증 실패 (토큰 없음·만료·폐기)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 역할 권한 부족 (authz.denied 감사 이벤트 기록)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ImportResult:
      type: object
      required: [request_id, imported, location_id]
      properties:
        request_id:
          type: string
        imported:
          type: array
          items:
            $ref: "#/components/schemas/ImportedCertificate"
        location_id:
          type: string
          format: uuid
    ImportedCertificate:
      type: object
      required:
        [id, fingerprint_sha256, common_name, not_before, not_after,
         certificate_type, status, duplicate]
      properties:
        id:
          type: string
          format: uuid
        fingerprint_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        common_name:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        certificate_type:
          type: string
          enum: [server, client, ca, code_signing, email, other]
        status:
          type: string
          enum: [active, expired, revoked, replaced, unknown]
        duplicate:
          type: boolean
          description: true면 fingerprint 중복 — 기존 레코드 재사용
    Certificate:
      type: object
      description: 인벤토리 인증서. 개인키·인증서 원문은 포함하지 않는다.
      required:
        [id, fingerprint_sha256, serial_number, subject_dn, issuer_dn, common_name,
         sans, not_before, not_after, public_key_algorithm, public_key_size,
         signature_algorithm, certificate_type, status, auto_renew, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        fingerprint_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        serial_number: { type: string }
        subject_dn: { type: string }
        issuer_dn: { type: string }
        issuer_organization:
          type: string
          nullable: true
          description: >
            발급자 DN의 O(Organization) 값 (0016). 신규 행은 x509 파서가 채우고
            0016 이전 행은 issuer_dn에서 소급 백필됐다. O가 없으면 null.
        common_name: { type: string }
        sans:
          type: array
          items: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        public_key_algorithm: { type: string }
        public_key_size: { type: integer }
        signature_algorithm: { type: string }
        certificate_type:
          type: string
          enum: [server, client, ca, code_signing, email, other]
        status:
          type: string
          enum: [active, expired, revoked, replaced, unknown]
        ca_id: { type: string, format: uuid, nullable: true }
        owner_id: { type: string, format: uuid, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        environment: { type: string, nullable: true }
        auto_renew: { type: boolean }
        renewal_policy_id: { type: string, format: uuid, nullable: true }
        subject_key_id:
          type: string
          nullable: true
          pattern: "^[0-9a-f]+$"
          description: SKI 소문자 hex. 확장 없는 인증서·0008 이전 데이터는 null
        authority_key_id:
          type: string
          nullable: true
          pattern: "^[0-9a-f]+$"
          description: AKI 소문자 hex. 확장 없는 인증서·0008 이전 데이터는 null
        replaced_by_certificate_id:
          type: string
          format: uuid
          nullable: true
          description: >
            교체 감지가 연결한 새 인증서(0015). status가 replaced일 때만 채워지며,
            새 인증서가 삭제되면 null로 되돌아간다(ON DELETE SET NULL — 옛 인증서의
            replaced 상태는 남는다).
        replaced_at:
          type: string
          format: date-time
          nullable: true
          description: 교체로 판정된 시각. 마지막 실관측 시각이 아니다.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RiskSeverity:
      type: string
      description: >
        위험 판정 심각도. 제품의 상태 3색 규약(danger/warn/ok)에 정보성 info를 더한
        4단이며 장식용 색이 아니다 — 사용자가 취할 행동이 단계마다 다르다.
      enum: [danger, warn, info, ok]
    RiskFinding:
      type: object
      description: >
        판정 결과 1건. 같은 code의 severity는 항상 같다(강도가 갈리는 판정은 코드를
        나눈다 — weak_key / key_deprecated_2030 / key_strong). message는 사람이 읽는
        사유이며 인증서 원문·개인키는 담기지 않는다(저장 자체를 하지 않는다).
      required: [code, severity, scope, title, public_trust_only, message]
      properties:
        code:
          type: string
          enum: [weak_key, key_deprecated_2030, key_strong, ed25519_key,
                 weak_signature, no_san, wildcard, wildcard_broad,
                 wildcard_multi_label, long_validity, expired_ca, self_signed,
                 chain_anomaly, legacy_tls, incomplete_chain]
        severity: { $ref: "#/components/schemas/RiskSeverity" }
        scope:
          type: string
          enum: [certificate, location]
          description: >
            판정 대상 축. certificate는 인증서 자체의 속성이고 location은 인증서가
            설치된 위치(엔드포인트)의 속성이다 — 조치 주체가 다르다. legacy_tls·
            incomplete_chain은 인증서를 재발급해도 해결되지 않고 서버 설정·배포를
            고쳐야 한다.
        title: { type: string, description: 화면 표시용 짧은 항목 이름 }
        public_trust_only:
          type: boolean
          description: >
            공인(publicly trusted) 인증서에만 적용되는 규칙인지. 폐쇄망 사설 PKI가
            주 사용처이므로 공인 전용 규칙을 사설 인증서에 danger로 띄우면 전건이
            빨간불이 된다 — 화면이 이 필드로 갈라 낼 수 있어야 한다.
            현재 판정 항목은 전부 false다(공인 전용 규칙은 아직 없다).
        message: { type: string }
    RiskAssessment:
      type: object
      description: >
        인증서 1건의 위험 판정. **저장하지 않고 조회 시 계산한다** — 기준선이
        2027·2030에 움직이므로 저장하면 낡는다(만료 판정과 같은 규약).
      required: [severity, findings]
      properties:
        severity:
          allOf: [{ $ref: "#/components/schemas/RiskSeverity" }]
          description: findings의 최고 심각도. 판정 항목이 하나도 없으면 ok다.
        findings:
          type: array
          description: 카탈로그 고정 순서 (요청마다 순서가 바뀌지 않는다)
          items: { $ref: "#/components/schemas/RiskFinding" }
    RiskSeverityCount:
      type: object
      required: [severity, count]
      properties:
        severity: { $ref: "#/components/schemas/RiskSeverity" }
        count: { type: integer }
    RiskFindingCount:
      type: object
      description: 판정 항목 메타데이터 + 건수. 건수 0인 항목도 내려온다.
      required: [code, severity, scope, title, public_trust_only, count]
      properties:
        code:
          type: string
          enum: [weak_key, key_deprecated_2030, key_strong, ed25519_key,
                 weak_signature, no_san, wildcard, wildcard_broad,
                 wildcard_multi_label, long_validity, expired_ca, self_signed,
                 chain_anomaly, legacy_tls, incomplete_chain]
        severity: { $ref: "#/components/schemas/RiskSeverity" }
        scope: { type: string, enum: [certificate, location] }
        title: { type: string }
        public_trust_only: { type: boolean }
        count: { type: integer }
    CertificateRisks:
      type: object
      required: [request_id, total, severities, findings]
      properties:
        request_id: { type: string }
        total:
          type: integer
          description: 집계 대상 인증서 수 (status=replaced 제외)
        severities:
          type: array
          description: 최고 심각도 기준 분할 — count의 합이 total과 같다.
          items: { $ref: "#/components/schemas/RiskSeverityCount" }
        findings:
          type: array
          description: >
            판정 항목별 건수. 인증서 1건이 여러 항목에 걸리므로 합은 total과 다르다.
          items: { $ref: "#/components/schemas/RiskFindingCount" }
    CertificateListItem:
      description: >
        목록 1행 = 인증서 + 목록 전용 파생 열. last_seen_at은 인증서의 속성이 아니라
        설치 위치 집계라 상세 응답·CSV 내보내기에는 없다.
      allOf:
        - $ref: "#/components/schemas/Certificate"
        - type: object
          required: [risk]
          properties:
            last_seen_at:
              type: string
              format: date-time
              nullable: true
              description: >
                이 인증서의 설치 위치 중 가장 최근 확인 시각
                (max(certificate_locations.last_verified_at)). 위치가 없거나 한 번도
                확인되지 않았으면 null이다. **정렬(sort) 대상이 아니다** — 집계
                파생값이라 정렬 화이트리스트에 넣지 않는다.
            risk:
              allOf: [{ $ref: "#/components/schemas/RiskAssessment" }]
              description: >
                조회 시점에 계산한 위험 판정. 목록 경로의 위치 축 입력은
                "removed가 아닌 위치가 관측한 TLS 버전"뿐이다(위치 배열 전체는
                상세 응답 소관). 저장 컬럼이 아니므로 CSV 내보내기에는 없다.
    CertificateList:
      type: object
      required: [request_id, items, total, page, page_size]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CertificateListItem" }
        total: { type: integer, description: 필터 적용 후 전체 건수 }
        page: { type: integer }
        page_size: { type: integer }
    RescanStatus:
      type: object
      description: >
        주기 재스캔 현황(06-rescan-and-replacement 11.2). 모든 수치는 파생 집계이며
        저장 컬럼이 아니다.
      required:
        [request_id, enabled, wired, interval_seconds, monitored_endpoints,
         retired_endpoints, due_endpoints]
      properties:
        request_id: { type: string }
        enabled:
          type: boolean
          description: 지금 자동으로 도는가. 배선이 없거나 RESCAN_ENABLED=false면 false다.
        wired:
          type: boolean
          description: >
            스케줄러 배선 자체의 유무. enabled=false의 두 원인(배선 없음 / 설정으로 끔)을
            화면이 구분할 수 있어야 하므로 별도 필드다.
        interval_seconds:
          type: integer
          description: >
            monitor별 override가 없을 때의 전역 재확인 주기(초). 배선이 없으면 기본값을
            표시용으로 내려준다. 만료 임박 가속 티어는 서버가 내부에서 적용한다.
        reason:
          type: string
          description: >
            enabled=false의 사유. 변수 이름과 상태만 담고 설정값은 담지 않는다
            (알림 채널 상태와 같은 규약).
        monitored_endpoints:
          type: integer
          description: 발주 대상 모니터 수(활성 + 미은퇴)
        retired_endpoints:
          type: integer
          description: 연속 미관측으로 은퇴한 모니터 수. 행은 이력으로 남는다.
        due_endpoints:
          type: integer
          description: >
            주기가 지났는데 아직 발주되지 않은 수 = 적체. 0이 정상이며, 계속 쌓이면
            스케줄러 미가동이나 배치 상한 부족을 의심한다.
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: origin=rescan 스캔 Job이 마지막으로 발주된 시각. 한 번도 없으면 null.
    RescanRunResult:
      type: object
      required: [request_id, dispatched_jobs, dispatched_endpoints]
      properties:
        request_id: { type: string }
        dispatched_jobs:
          type: integer
          description: 만들어진 스캔 Job 수. 포트별 그룹 발주라 보통 소수다.
        dispatched_endpoints:
          type: integer
          description: 이번 배치가 claim한 엔드포인트 수. 0이면 지금 재확인할 것이 없다.
    IssuerOrgCount:
      type: object
      required: [organization, count]
      properties:
        organization:
          type: string
          nullable: true
          description: null이면 발급자 DN에 O가 없는 인증서 묶음
        count: { type: integer }
    CALeafPreview:
      type: object
      description: >
        CA 노드가 직접 발급한 리프 1건의 미리보기. 트리를 펼쳤을 때 "무엇이
        달려 있나"를 즉시 보여주기 위한 최소 필드만 담는다 — 전체 목록은
        GET /api/v1/certificates?issued_by=&lt;노드 id&gt;로 조회한다.
      required: [id, common_name, subject_dn, not_after, status]
      properties:
        id: { type: string, format: uuid }
        common_name: { type: string }
        subject_dn: { type: string }
        not_after: { type: string, format: date-time }
        status:
          type: string
          enum: [active, expired, revoked, replaced, unknown]
    CATreeNode:
      type: object
      description: >
        CA 트리 1노드. 루트(자체 서명 CA) 아래로 실제 계층 그대로 중첩된다 —
        중간 CA의 중간 CA도 평탄화하지 않고 제 부모 아래에 붙는다(깊이 제한 없음;
        내부 안전 상한 16단은 교차 서명·손상 데이터용이며 정상 데이터는 걸리지 않는다).
        인벤토리에 없는 상위는 stored=false·id null로 subject_dn만 안다
        (체인 항목과 같은 규약).
      required: [id, stored, subject_dn, common_name, not_after, status, self_signed, depth, leaf_count, subtree_leaf_count, leaf_preview, children]
      properties:
        id: { type: string, format: uuid, nullable: true }
        stored: { type: boolean }
        subject_dn: { type: string }
        common_name: { type: string, nullable: true }
        not_after: { type: string, format: date-time, nullable: true }
        status:
          type: string
          nullable: true
          enum: [active, expired, revoked, replaced, unknown, null]
        self_signed: { type: boolean }
        depth:
          type: integer
          description: 이 노드가 놓인 계층 (최상위 0). 중첩 구조에서 파생 가능하지만 명시한다.
        leaf_count:
          type: integer
          description: 이 CA가 직접 발급한 비-CA 인증서 수 (replaced 제외)
        subtree_leaf_count:
          type: integer
          description: >
            이 노드와 모든 하위 CA(손자·증손자 포함)의 leaf_count 합산.
            화면의 "하위 포함 N건" 표기용이다.
        leaf_preview:
          type: array
          maxItems: 5
          description: >
            이 노드가 직접 발급한 리프 중 만료가 가장 임박한 최대 5건.
            leaf_count가 이 배열 길이보다 크면 나머지가 있다는 뜻이며,
            GET /api/v1/certificates?issued_by=&lt;id&gt;로 이어서 조회한다.
            stored=false인 자리 노드는 항상 빈 배열이다.
          items: { $ref: "#/components/schemas/CALeafPreview" }
        children:
          type: array
          description: 이 노드가 직접 발급한 하위 CA들
          items: { $ref: "#/components/schemas/CATreeNode" }
    CertificateIssuers:
      type: object
      required: [request_id, organizations, ca_tree, unmatched_leaf_count]
      properties:
        request_id: { type: string }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/IssuerOrgCount" }
        ca_tree:
          type: array
          items: { $ref: "#/components/schemas/CATreeNode" }
        unmatched_leaf_count:
          type: integer
          description: 어떤 보유 CA와도 발급 관계가 잡히지 않는 비-CA 인증서 수 (replaced 제외)
    CertificateSummary:
      type: object
      description: >
        대시보드 요약 집계. expiring_* 값은 누적(30d는 7d 포함)이며 만료분 제외.
        status=replaced인 인증서는 전 구간에서 제외한다 — 만료 알림에서 이미 빠져 있어
        남겨 두면 두 화면이 서로를 부정한다(06-rescan-and-replacement 11.4).
      required:
        [request_id, total, expiring_7d, expiring_30d, expiring_60d, expiring_90d,
         expired, self_signed, unowned]
      properties:
        request_id: { type: string }
        total: { type: integer }
        expiring_7d: { type: integer }
        expiring_30d: { type: integer }
        expiring_60d: { type: integer }
        expiring_90d: { type: integer }
        expired: { type: integer }
        self_signed: { type: integer, description: subject_dn = issuer_dn 건수 }
        unowned: { type: integer, description: owner_id 미지정 건수 }
    TargetRef:
      type: object
      description: 설치 위치에 붙는 대상 시스템 요약
      required: [id, name, target_type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        target_type: { type: string }
        hostname: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
    CertificateLocation:
      type: object
      required: [id, certificate_id, target_id, location_type, deployment_status, target]
      properties:
        id: { type: string, format: uuid }
        certificate_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        location_type:
          type: string
          enum: [network_endpoint, file, windows_store, keystore, other]
        file_path: { type: string, nullable: true }
        store_name: { type: string, nullable: true }
        service_name: { type: string, nullable: true }
        port: { type: integer, nullable: true, minimum: 1, maximum: 65535 }
        last_verified_at: { type: string, format: date-time, nullable: true }
        deployment_status:
          type: string
          enum: [unknown, deployed, pending, failed, removed]
        tls_version:
          type: string
          nullable: true
          description: 네트워크 스캔이 관측한 협상 TLS 버전 (예 TLS 1.2). 스캔 이력이 없으면 null
        current_fingerprint:
          type: string
          nullable: true
          pattern: "^[0-9a-f]{64}$"
          description: >
            이 위치의 (대상, 포트) 엔드포인트에서 마지막으로 관측된 인증서 지문
            (endpoint_monitors, 0015). 재스캔이 꺼져 있거나 아직 한 번도 성공하지
            못했으면 null이다.
        current_certificate_id:
          type: string
          format: uuid
          nullable: true
          description: >
            current_fingerprint에 해당하는 인벤토리 인증서 id. 화면은 이 값으로
            위치를 3분류한다 — certificate_id와 같으면 "서비스 중", 다르면
            "다른 인증서로 교체됨", current_fingerprint가 null이면 "확인 안 됨".
        presented_chain_len:
          type: integer
          nullable: true
          minimum: 0
          description: >
            마지막 관측에서 이 엔드포인트가 제시한 인증서 장수 (0018).
            0018 이전 관측·파일 업로드 위치는 null(미상)이며 재스캔으로만 채워진다.
        chain_complete:
          type: boolean
          nullable: true
          description: >
            제시된 체인만으로 리프에서 위로 끊김 없이 이어지는지 (0018).
            인벤토리의 다른 인증서로 보완하지 않은 값이므로 false는 곧 중간 CA
            누락(풀체인 미배포)이다 — 브라우저는 AIA로 보완하지만 curl·Java·
            Python·모바일 클라이언트는 즉시 실패한다. 루트 CA를 보내지 않는 것은
            정상 관행이므로 불완전으로 세지 않는다. null이면 미상이다.
        target: { $ref: "#/components/schemas/TargetRef" }
    ServerList:
      type: object
      required: [request_id, items, total, page, page_size]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ServerListItem" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    ServerListItem:
      type: object
      description: 서버 1행 = targets 1행. 전부 파생 집계이며 저장 컬럼이 없다.
      required:
        [id, scope, endpoint_count, certificate_count, stale_count,
         estimated_count, ports]
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string, nullable: true }
        ip_address: { type: string, nullable: true }
        scope:
          type: string
          description: targets.executor_scope — server 또는 sensor:&lt;센서 id&gt;
        sensor_name:
          type: string
          nullable: true
          description: scope가 센서일 때 그 센서 이름. 서버 스코프면 null
        endpoint_count: { type: integer, description: 이 서버의 (포트) 엔드포인트 수 }
        certificate_count:
          type: integer
          description: 지금 서비스 중이라고 판정한 인증서의 고유 수(구버전 잔존 제외)
        earliest_not_after:
          type: string
          format: date-time
          nullable: true
          description: >
            서비스 중인 인증서들의 min(not_after) = 이 서버의 위험도. 붙어 있는
            인증서를 하나도 특정하지 못하면 null이고 risk 정렬에서 뒤로 간다.
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: 엔드포인트들의 max(last_success_at)
        stale_count:
          type: integer
          description: 현재 인증서와 다른, 아직 제거되지 않은 위치 행 수(구버전 잔존)
        estimated_count:
          type: integer
          description: >
            현재 인증서를 관측 지문이 아니라 최근 live 위치로 **추정**한 엔드포인트 수.
            0보다 크면 화면이 '추정' 배지를 붙인다.
        ports:
          type: array
          description: 오름차순 포트 미리보기(최대 5개). 전체 수는 endpoint_count다
          items: { type: integer, minimum: 1, maximum: 65535 }
    ServerDetail:
      type: object
      required: [request_id, server, endpoints]
      properties:
        request_id: { type: string }
        server: { $ref: "#/components/schemas/ServerListItem" }
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/ServerEndpoint" }
    ServerEndpoint:
      type: object
      required: [port, certificate_estimated, consecutive_misses, stale_locations]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        certificate:
          allOf: [{ $ref: "#/components/schemas/ServerCertificateRef" }]
          nullable: true
          description: 지금 이 포트에 붙어 있다고 판정한 인증서. 못 정하면 null
        certificate_estimated:
          type: boolean
          description: >
            true면 certificate는 관측 지문이 아니라 "가장 최근 확인된 live 위치"로
            추정한 값이다(재스캔 OFF이거나 아직 미실행). 화면은 반드시 구분해 표시한다.
        tls_version: { type: string, nullable: true }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_probe_at: { type: string, format: date-time, nullable: true }
        consecutive_misses: { type: integer }
        retired_at:
          type: string
          format: date-time
          nullable: true
          description: 연속 미관측으로 은퇴한 시각(0015). 살아 있는 위치가 남아 있어야 보인다
        stale_locations:
          type: array
          description: 이 포트에 남아 있는 구버전 인증서 위치
          items: { $ref: "#/components/schemas/ServerStaleLocation" }
    ServerCertificateRef:
      type: object
      description: 엔드포인트에 붙은 인증서 요약. 원문(PEM/DER)·개인키는 포함하지 않는다.
      required: [id, common_name, not_after, status, fingerprint_sha256]
      properties:
        id: { type: string, format: uuid }
        common_name: { type: string }
        not_after: { type: string, format: date-time }
        status:
          type: string
          enum: [active, expired, revoked, replaced, unknown]
        fingerprint_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    ServerStaleLocation:
      type: object
      required: [location_id, certificate, deployment_status]
      properties:
        location_id: { type: string, format: uuid }
        certificate: { $ref: "#/components/schemas/ServerCertificateRef" }
        last_verified_at: { type: string, format: date-time, nullable: true }
        deployment_status:
          type: string
          enum: [unknown, deployed, pending, failed, removed]
        tls_version: { type: string, nullable: true }
    CertificateChainItem:
      type: object
      description: |
        체인 1단계. 첫 항목은 조회한 인증서 자신, 마지막은 루트(self_signed=true)
        또는 인벤토리에 없는 상위(stored=false — subject_dn은 하위의 issuer_dn)다.
      required: [id, stored, subject_dn, common_name, not_after, certificate_type, status, self_signed]
      properties:
        id: { type: string, format: uuid, nullable: true, description: 미보유(stored=false)면 null }
        stored: { type: boolean, description: 인벤토리 보유 여부 }
        subject_dn: { type: string }
        common_name: { type: string, nullable: true }
        not_after: { type: string, format: date-time, nullable: true }
        certificate_type:
          type: string
          nullable: true
          enum: [server, client, ca, code_signing, email, other, null]
        status:
          type: string
          nullable: true
          enum: [active, expired, revoked, replaced, unknown, null]
        self_signed: { type: boolean, description: 자체 서명(루트) 여부 }
    OwnerRef:
      type: object
      description: >
        인증서 소유자(certificate.owner_id) 표시용 요약. 화면이 UUID 대신 이름을
        띄우기 위한 최소 필드만 담으며 메일 주소·부서 등 계정 정보는 담지 않는다.
      required: [id, username, is_active]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string, nullable: true }
        is_active: { type: boolean, description: 비활성(퇴사 등) 계정 표시용 }
    CertificateDetail:
      type: object
      required: [request_id, certificate, locations, chain, risk]
      properties:
        request_id: { type: string }
        certificate: { $ref: "#/components/schemas/Certificate" }
        risk:
          allOf: [{ $ref: "#/components/schemas/RiskAssessment" }]
          description: >
            조회 시점에 계산한 위험 판정. 상세는 위치 배열을 가지고 있으므로
            위치 축(scope=location) 판정도 실제 위치로 계산한다 —
            deployment_status=removed 위치의 옛 관측은 판정에서 뺀다.
        owner:
          allOf: [{ $ref: "#/components/schemas/OwnerRef" }]
          nullable: true
          description: >
            certificate.owner_id가 가리키는 계정. 소유자 미지정이거나 계정이
            사라졌으면 null이다 (owner_id 유무로 두 경우를 구분한다).
        locations:
          type: array
          items: { $ref: "#/components/schemas/CertificateLocation" }
        chain:
          type: array
          description: 자신→상위→루트 순 발급자 체인
          items: { $ref: "#/components/schemas/CertificateChainItem" }
    Healthz:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [up, down]
    Role:
      type: string
      description: 기본 역할 6종 (00-spec 7.11)
      enum:
        - system_administrator
        - pki_administrator
        - security_administrator
        - operator
        - auditor
        - viewer
    User:
      type: object
      description: 로컬 계정. password_hash는 어떤 응답에도 포함되지 않는다.
      required: [id, username, role, auth_provider, is_active]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string, nullable: true }
        role: { $ref: "#/components/schemas/Role" }
        auth_provider: { type: string, description: "MVP는 local. LDAP/AD/OIDC/SAML 확장점." }
        is_active: { type: boolean }
        department_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        email:
          type: string
          format: email
          nullable: true
          description: >
            알림 메일 수신 주소. null이면 이 계정은 owner/role/user 수신자로 지정돼도
            메일 채널에서 수신자로 해석되지 않는다.
    ScanRequest:
      type: object
      description: 네트워크 TLS 스캔 입력 (00-spec 7.1)
      required: [targets]
      properties:
        targets:
          type: array
          description: IP 또는 CIDR 목록 (예 "10.0.0.5", "10.0.0.0/24")
          items: { type: string }
        port_spec:
          type: string
          description: >
            자유 텍스트 포트 사양. 콤마 나열("443,8443")·범위("8000-9000")·
            프리셋(web/common/all)을 혼용한다. 지정하면 ports보다 우선한다.
            all 프리셋도 그대로 받는다 — 총 엔드포인트 수가 임계를 넘으면
            스윕으로 자동 승격되므로 요청을 다시 쓸 필요가 없다.
          example: "443,8000-9000,web"
        ports:
          type: array
          description: >
            스캔할 포트 목록(하위 호환 입력). port_spec이 있으면 무시된다.
            둘 다 없으면 기본값은 common 프리셋(26개)이다 — 예전 기본값 [443]에서 바뀌었다.
          items: { type: integer, minimum: 1, maximum: 65535 }
        timeout_ms:
          type: integer
          description: 엔드포인트별 타임아웃(ms). 미지정 시 기본값으로 클램프(100~30000).
        concurrency:
          type: integer
          description: 동시 연결 수. 미지정 시 기본값으로 클램프(1~256).
        sensor_id:
          type: string
          format: uuid
          description: >
            지정하면 서버 직접 실행 대신 해당 센서가 스캔한다 (Phase 3a).
            active 센서만 허용 — 아니면 422. pending Job만 만들어지고 센서가 pull 리스로 가져간다.
    DuplicateScan:
      type: object
      description: 409 duplicate_scan 응답 — 표준 오류 + 기존 활성 Job id.
      required: [error, job_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [duplicate_scan] }
            message: { type: string }
        job_id:
          type: string
          description: 이미 활성인 동일 요청 Job id. 극단 경합으로 특정하지 못하면 빈 문자열.
        request_id: { type: string }
    ScanJobList:
      type: object
      required: [request_id, items, total, page, page_size]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ScanJob" }
        total: { type: integer, description: 필터 적용 후 전체 건수 }
        page: { type: integer }
        page_size: { type: integer }
    ActivityItem:
      type: object
      description: >
        통합 작업 목록의 1행. 축(kind)마다 쓰이지 않는 필드는 null이다.
      required:
        [kind, id, status, active, cancel, executor_scope, targets, port_spec,
         total_endpoints, scanned_endpoints, reachable_endpoints,
         certificates_found, certificates_new, started_at]
      properties:
        kind:
          type: string
          enum: [scan, sweep, schedule_run]
          description: >
            취소·상세 API 경로가 축마다 다르다. scan = /discovery/scans/{id},
            sweep = /discovery/sweeps/{id}, schedule_run = 정기 스캔 실행.
        id: { type: string, format: uuid }
        status:
          type: string
          description: 축별 원래 상태 문자열(스캔 pending·…, 스윕 queued·…, 실행 running·…)
        active:
          type: boolean
          description: 아직 끝나지 않았는가(축별 종료 상태의 여집합)
        cancel:
          type: boolean
          description: >
            지금 이 항목을 취소할 수 있는지의 **서버 판정**. 스캔은 pending 또는
            서버 실행 running만, 스윕은 queued/running/paused, 정기 스캔 실행은
            running일 때 true다.
        name:
          type: string
          nullable: true
          description: 스윕 이름 또는 정기 스캔 이름. 단발 스캔은 null.
        origin:
          type: string
          nullable: true
          description: 스캔의 발주 출처(manual) 또는 실행의 발동 주체(schedule|manual)
        executor_scope:
          type: string
          description: server 또는 sensor:<센서 id> (0010 규약)
        targets:
          type: array
          items: { type: string }
        port_spec:
          type: string
          description: 입력 원문. 단발 스캔만 전개된 포트 목록("443,8443")이다.
        total_endpoints: { type: integer, format: int64 }
        scanned_endpoints: { type: integer, format: int64 }
        reachable_endpoints: { type: integer, format: int64 }
        certificates_found: { type: integer, format: int64 }
        certificates_new: { type: integer, format: int64 }
        error: { type: string, nullable: true }
        schedule_id:
          type: string
          format: uuid
          nullable: true
          description: schedule_run일 때 소속 정기 스캔 설정 id
        sweep_id:
          type: string
          format: uuid
          nullable: true
          description: schedule_run이 발주한 스윕 id (발주 전이면 null)
        started_at:
          type: string
          format: date-time
          description: 정렬 기준 시각(스캔·스윕은 생성 시각, 실행은 시작 시각)
        finished_at: { type: string, format: date-time, nullable: true }
    ActivityList:
      type: object
      required: [request_id, items, total, page, page_size]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        total: { type: integer, description: 필터 적용 후 전체 건수 }
        page: { type: integer }
        page_size: { type: integer }
    DiscoveryDefaults:
      type: object
      description: 환경변수가 반영된 스캔·스윕 유효 기본값과 상한
      required: [request_id, sweep, scan, limits]
      properties:
        request_id: { type: string }
        sweep:
          type: object
          required: [rate_pps, chunk_endpoints, max_days]
          properties:
            rate_pps: { type: integer, description: SCAN_SWEEP_RATE_PPS 유효값 }
            chunk_endpoints: { type: integer, description: SCAN_SWEEP_CHUNK_ENDPOINTS 유효값 }
            max_days: { type: integer, description: SCAN_SWEEP_MAX_DAYS 유효값 (초과 시 생성 422) }
        scan:
          type: object
          required: [port_spec]
          properties:
            port_spec: { type: string, description: 포트 미지정 시 적용하는 기본 사양 }
        limits:
          type: object
          required: [max_rate_pps, max_endpoints]
          properties:
            max_rate_pps: { type: integer, description: 요청 가능한 속도 상한(초과분은 잘린다) }
            max_endpoints: { type: integer, description: 단발 스캔 1건의 (IP, 포트) 조합 상한 }
    DerivedNetwork:
      type: object
      required: [cidr, target_count]
      properties:
        cidr: { type: string, description: 발견된 대상에서 파생한 /24 대역 }
        target_count: { type: integer, description: 이 대역에서 이미 발견된 대상 수 }
    ScanSuggestions:
      type: object
      required: [request_id, recent_targets, derived_networks, configured_networks]
      properties:
        request_id: { type: string }
        recent_targets:
          type: array
          items: { type: string }
          description: 최근 수동 스캔의 대상 원문 (IP/CIDR, 최근 사용 순·중복 제거, 최대 10)
        derived_networks:
          type: array
          items: { $ref: "#/components/schemas/DerivedNetwork" }
          description: 발견된 대상의 /24 파생 대역 (대상 수 내림차순, 최대 20)
        configured_networks:
          type: array
          items: { type: string }
          description: SCAN_SUGGESTED_NETWORKS 운영자 지정 대역 (정규화된 CIDR)
    ScanAccepted:
      type: object
      description: >
        스캔 발주 결과. 총 엔드포인트 수가 임계(SCAN_SWEEP_CHUNK_ENDPOINTS, 기본 4096)를
        **넘으면** 단발 Job 대신 스윕이 만들어진다(자동 승격) — 그때는 mode=sweep,
        promoted=true이고 job_id 대신 sweep_id가 실린다. 화면은 mode로 어느 쪽을
        추적할지 정한다.
      required: [mode, promoted, status, total_endpoints]
      properties:
        mode:
          type: string
          enum: [scan, sweep]
          description: 실제로 만들어진 작업 종류
        promoted:
          type: boolean
          description: 단발 요청이 임계 초과로 스윕이 되었는가
        job_id:
          type: string
          format: uuid
          description: mode=scan일 때만 있다
        sweep_id:
          type: string
          format: uuid
          description: mode=sweep일 때만 있다
        status: { type: string, enum: [pending, queued] }
        total_endpoints:
          type: integer
          format: int64
          description: 펼쳐진 (IP, 포트) 조합 수
        total_chunks:
          type: integer
          description: mode=sweep일 때의 청크 수
        estimated_finish_at:
          type: string
          format: date-time
          nullable: true
          description: mode=sweep일 때의 예상 종료 시각
        request_id: { type: string }
    ScanPreview:
      type: object
      description: >
        스캔 미리보기 결과 (아무것도 만들지 않는다). 발주와 같은 함수가 계산하므로
        이 숫자가 실제로 도는 작업과 같다. 포트 목록 자체는 싣지 않는다 — all
        프리셋이면 6.5만 개다(프리셋의 실제 포트는 GET /discovery/port-presets).
      required:
        [request_id, mode, promoted, promotion_threshold, targets, ip_count, port_spec,
         port_count, total_endpoints, rate_pps, estimated_seconds, estimated_finish_at,
         total_chunks, max_days, too_long]
      properties:
        request_id: { type: string }
        mode:
          type: string
          enum: [scan, sweep]
          description: 이대로 발주하면 만들어질 작업 종류
        promoted: { type: boolean, description: 임계 초과로 스윕이 되는가 }
        promotion_threshold:
          type: integer
          description: 승격 임계 엔드포인트 수 (SCAN_SWEEP_CHUNK_ENDPOINTS, 기본 4096)
        targets:
          type: array
          items: { type: string }
          description: 입력 원문 그대로(정규화하지 않는다)
        ip_count: { type: integer, description: 전개된 개별 IP 수 (중복 제거) }
        port_spec:
          type: string
          description: 유효 포트 사양. 입력이 비면 기본값 common, ports 배열 입력은 같은 문법의 문자열로 되돌린다.
        port_count: { type: integer }
        total_endpoints: { type: integer, format: int64, description: IP 수 × 포트 수 }
        rate_pps:
          type: integer
          description: 실제 적용될 레이트 (단발 50 / 스윕 SCAN_SWEEP_RATE_PPS)
        estimated_seconds: { type: integer, format: int64, description: 예상 소요(초, 올림) }
        estimated_finish_at: { type: string, format: date-time }
        total_chunks: { type: integer, description: 승격 경로에서만 0이 아니다 }
        max_days: { type: integer, description: 스윕 ETA 상한 (SCAN_SWEEP_MAX_DAYS) }
        too_long:
          type: boolean
          description: true면 이대로 발주해도 422(sweep_too_long)로 거부된다
        message:
          type: string
          description: too_long일 때의 사유 문구(실제 소요 일수 포함 — 발주 거부 메시지와 같다)
    ScanJob:
      type: object
      description: 스캔 Job 상태·진행률·결과 요약
      required:
        [id, status, origin, executor_type, targets, ports, total_endpoints, scanned_endpoints,
         reachable_endpoints, certificates_found, certificates_new, created_at]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, leased, running, completed, failed, canceled]
          description: >
            leased = 센서가 Job을 수령했고 아직 실행 보고(running 하트비트) 전인 상태 (00-spec 7.8).
            리스 만료까지 running 전이가 없으면 서버가 failed로 회수한다.
            canceled = 취소 API로 종료된 상태 (0017 — pending 또는 서버 실행 running만 취소 가능).
        origin:
          type: string
          enum: [manual, sweep, rescan]
          description: >
            발주 출처 (0015). manual = 사람 발주, sweep = 전 포트 스윕의 자식 청크,
            rescan = 주기 재스캔 스케줄러 발주.
        executor_type:
          type: string
          enum: [server, sensor]
          description: Job 실행 주체. server = 서버 직접 실행, sensor = 센서 위임(pull 리스).
        sensor_id:
          type: string
          format: uuid
          nullable: true
          description: executor_type이 sensor일 때 실행을 맡은 센서 id. 서버 실행이면 null.
        targets:
          type: array
          items: { type: string }
        ports:
          type: array
          items: { type: integer }
        timeout_ms:
          type: integer
          description: 요청 입력 원문. 0 = 서버 기본값 적용(클램프 규칙 100~30000ms).
        concurrency:
          type: integer
          description: 요청 입력 원문. 0 = 서버 기본값 적용(클램프 규칙 1~256).
        total_endpoints: { type: integer }
        scanned_endpoints: { type: integer }
        reachable_endpoints:
          type: integer
          description: TLS 핸드셰이크에 성공해 인증서를 수집한 엔드포인트 수
        certificates_found:
          type: integer
          description: 수집된 인증서 총 개수(중복 포함)
        certificates_new:
          type: integer
          description: fingerprint 신규로 인벤토리에 추가된 인증서 수
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
    Sensor:
      type: object
      description: >
        센서(원격 수집기) — 분리망 세그먼트당 배치하는 수집기 (00-spec 7.8).
        등록 토큰은 SHA-256 해시만 저장되며 어떤 조회 응답에도 포함되지 않는다.
      required: [id, name, status, token_expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [pending, active, disabled]
        token_expires_at:
          type: string
          format: date-time
          description: 1회용 등록 토큰 만료 시각 (발급 후 24h)
        client_cert_fingerprint_sha256:
          type: string
          nullable: true
          description: 등록된 mTLS 클라이언트 인증서 SHA-256 (hex 64자 소문자). 등록 전 null.
        registered_at: { type: string, format: date-time, nullable: true }
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: 마지막 mTLS 통신(하트비트 포함) 시각
        disabled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SensorList:
      type: object
      required: [request_id, items]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/Sensor" }
    SensorDetail:
      type: object
      required: [request_id, sensor]
      properties:
        request_id: { type: string }
        sensor: { $ref: "#/components/schemas/Sensor" }
    SensorCreateResult:
      type: object
      required: [request_id, sensor, enrollment_token, ca_fingerprint, enroll_command_example]
      properties:
        request_id: { type: string }
        sensor: { $ref: "#/components/schemas/Sensor" }
        enrollment_token:
          type: string
          description: 1회용 등록 토큰 평문 (hex 64자). 이 응답에서만 1회 노출 — 재조회 불가.
        ca_fingerprint:
          type: string
          description: 센서 CA 인증서 DER의 SHA-256 (hex 64자) — enroll의 --ca-fingerprint 핀 값
        enroll_command_example:
          type: string
          description: >-
            센서 호스트에서 실행할 enroll 명령 예시. 서버 주소는 자리표시이고,
            포트는 서버에 설정된 실제 센서 게이트웨이 포트(SENSOR_LISTEN_ADDR)다.
    AuditEvent:
      type: object
      description: 감사 이벤트 (00-spec 7.12·12장). before/after에 민감값 없음.
      required: [id, event_type, target_type, result, created_at, integrity_hash, prev_hash]
      properties:
        id: { type: integer, format: int64 }
        event_type: { type: string, example: user.login }
        actor_id: { type: string, format: uuid, nullable: true }
        target_type: { type: string }
        target_id: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        before_value: { nullable: true }
        after_value: { nullable: true }
        result: { type: string, enum: [success, failure, denied] }
        source_ip: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        integrity_hash:
          type: string
          description: SHA-256 해시 체인 무결성 검증값 (hex 64자)
        prev_hash:
          type: string
          description: 직전 이벤트의 integrity_hash (첫 이벤트는 '0' 64자)
    AuditEventList:
      type: object
      required: [request_id, items, total, page, page_size]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    AuditVerifyResult:
      type: object
      required: [request_id, valid, total_events, invalid, invalid_capped]
      properties:
        request_id: { type: string }
        valid: { type: boolean }
        total_events: { type: integer, format: int64 }
        head_id: { type: integer, format: int64, nullable: true }
        head_hash:
          type: string
          nullable: true
          description: 체인 꼬리 해시 — 외부 기록(anchoring)용
        invalid:
          type: array
          description: 변조 의심 행 (최대 100건)
          items:
            type: object
            required: [id, hash_mismatch, chain_broken]
            properties:
              id: { type: integer, format: int64 }
              hash_mismatch: { type: boolean, description: 행 내용 변조 }
              chain_broken: { type: boolean, description: 직전 행과 연결 단절 }
        invalid_capped: { type: boolean }
    SweepRequest:
      type: object
      description: 전 포트 백그라운드 스윕 입력 (04-port-autoscan 9.2)
      required: [targets]
      properties:
        name: { type: string, nullable: true, description: 표시 이름 (선택) }
        targets:
          type: array
          description: IP 또는 CIDR 목록. 개별 IP 수 상한은 65536(/16 하나)이다.
          items: { type: string }
        port_spec:
          type: string
          description: 포트 사양. 비우면 all(1-65535) — 스윕의 기본 용도다.
          example: "all"
        sensor_id:
          type: string
          format: uuid
          nullable: true
          description: 지정하면 청크 Job이 그 센서에 배정된다(active 센서만, 아니면 422).
        rate_pps:
          type: integer
          description: 초당 프로브 수. 0/미지정이면 서버 기본값(SCAN_SWEEP_RATE_PPS).
        chunk_endpoints:
          type: integer
          description: 청크 하나의 최대 엔드포인트 수. 0/미지정이면 서버 기본값.
    SweepAccepted:
      type: object
      required: [sweep_id, status, total_endpoints, total_chunks]
      properties:
        sweep_id: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
        total_endpoints:
          type: integer
          format: int64
          description: IP 수 × 포트 수 (전수 스캔은 수천만이라 bigint다)
        total_chunks: { type: integer }
        estimated_finish_at: { type: string, format: date-time, nullable: true }
        request_id: { type: string }
    SweepProgress:
      type: object
      description: 자식 scan_jobs 집계에서 파생한 진행률 (부모에 카운터를 두지 않는다)
      properties:
        chunks_total: { type: integer }
        chunks_completed: { type: integer }
        chunks_active: { type: integer }
        failed_attempts: { type: integer }
        scanned_endpoints: { type: integer, format: int64 }
        reachable_endpoints: { type: integer, format: int64 }
        certificates_found: { type: integer, format: int64 }
        certificates_new: { type: integer, format: int64 }
    Sweep:
      type: object
      description: 스윕 1건 (상태 머신 + 조회 시점 진행률)
      required:
        [id, status, targets, port_spec, executor_scope, total_endpoints, total_chunks,
         next_seq, rate_pps, chunk_endpoints, created_at, updated_at, progress]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true }
        status:
          type: string
          enum: [queued, running, paused, completed, failed, canceled]
        targets:
          type: array
          items: { type: string }
        port_spec: { type: string, description: 입력 원문 (재현·감사용) }
        executor_scope:
          type: string
          description: server 또는 sensor:&lt;uuid&gt;
        total_endpoints: { type: integer, format: int64 }
        total_chunks: { type: integer }
        next_seq: { type: integer }
        rate_pps: { type: integer }
        chunk_endpoints: { type: integer }
        estimated_finish_at: { type: string, format: date-time, nullable: true }
        stalled_since:
          type: string
          format: date-time
          nullable: true
          description: 센서 스코프 스윕이 청크를 집어가지 않고 대기 중인 시작 시각(신규 종료 상태가 아니다)
        last_error: { type: string, nullable: true }
        schedule_id:
          type: string
          format: uuid
          nullable: true
          description: >
            이 스윕을 발주한 정기 스캔 스케줄(0019). 사람이 낸 발주는 null이며
            정기/수동 구분은 이 필드로 한다(scan_jobs.origin은 건드리지 않는다).
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        progress: { $ref: "#/components/schemas/SweepProgress" }
    ScanSchedule:
      type: object
      description: >
        정기 스캔 설정 1건 (0019). kind가 규칙을 가른다 — full·registered는 각각
        1행뿐이라 만들거나 지울 수 없고 설정만 바꾸며, registered는 대상·포트를
        갖지 않는다(대상은 이미 등록된 엔드포인트다).
      required:
        [id, kind, name, enabled, targets, executor_scope, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [full, preset, registered]
          description: full=지정 대역 전 포트 / preset=사전 등록 대역·포트(N행) / registered=등록된 엔드포인트
        name: { type: string }
        enabled:
          type: boolean
          description: full의 기본값은 false다 — 신규 설치가 저절로 전 대역을 훑지 않는다.
        targets:
          type: array
          items: { type: string }
          description: IP/CIDR 입력 원문. registered는 항상 빈 배열이다.
        port_spec:
          type: string
          nullable: true
          description: 포트 사양 원문('all', '443,8443' 등). registered는 항상 null이다.
        interval_seconds:
          type: integer
          nullable: true
          description: >
            null이면 서버 기본 주기다(registered는 RESCAN_INTERVAL). full·preset은
            1시간 이상이어야 한다 — 더 짧으면 스윕이 앞 실행을 따라잡지 못한다.
        rate_pps: { type: integer, nullable: true, description: null이면 서버 기본 레이트 }
        executor_scope:
          type: string
          description: server 또는 sensor:&lt;uuid&gt;
        next_run_at:
          type: string
          format: date-time
          nullable: true
          description: >
            다음 예정 시각. 꺼져 있으면 null이다. '지금 실행'은 이 값을 건드리지 않는다.
        last_run_started_at: { type: string, format: date-time, nullable: true }
        last_run_id: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ScanScheduleRun:
      type: object
      description: >
        정기 스캔 실행 1건. 스케줄당 running은 최대 1건이며(부분 유니크 인덱스),
        실행이 끝날 때까지 그 스케줄의 주기는 건너뛰어진다 — 겹침이 구조적으로 없다.
      required: [id, schedule_id, trigger, status, dispatched_jobs, dispatched_endpoints, started_at]
      properties:
        id: { type: string, format: uuid }
        schedule_id: { type: string, format: uuid }
        trigger:
          type: string
          enum: [schedule, manual]
          description: schedule=주기 도래 / manual=사용자의 '지금 실행'
        status:
          type: string
          enum: [running, completed, failed, canceled]
        sweep_id:
          type: string
          format: uuid
          nullable: true
          description: full·preset이 발주한 스윕. registered 실행은 항상 null이다.
        dispatched_jobs: { type: integer }
        dispatched_endpoints: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    ScanScheduleList:
      type: object
      required: [request_id, items, wired]
      properties:
        request_id: { type: string }
        wired:
          type: boolean
          description: >
            스케줄러 배선 유무. false면 '지금 실행'·취소가 503이다(조회·설정 변경은 정상).
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ScanSchedule"
              - type: object
                properties:
                  active_run:
                    allOf: [{ $ref: "#/components/schemas/ScanScheduleRun" }]
                    nullable: true
                    description: 지금 도는 실행. 있으면 '지금 실행'은 409다.
                  last_run:
                    allOf: [{ $ref: "#/components/schemas/ScanScheduleRun" }]
                    nullable: true
                    description: 마지막 실행(상태 무관). 한 번도 안 돌았으면 null이다.
    ScanScheduleUpdateRequest:
      type: object
      description: >
        보내지 않은 필드는 바뀌지 않는다. interval_seconds·rate_pps는 null을 명시해
        서버 기본값으로 되돌린다("키 없음"과 "값 null"은 다르다).
        모르는 필드는 400으로 거부한다 — 조용히 버리면 "200인데 값이 안 들어갔다"가 된다.
      properties:
        id:
          type: string
          format: uuid
          description: 수정 대상. kind와 **둘 중 하나만** 보낸다.
        kind:
          type: string
          enum: [full, registered]
          description: 단일 행 종류를 id 없이 지목한다. preset은 N행이라 id로만 지목한다.
        name: { type: string }
        enabled: { type: boolean }
        targets:
          type: array
          items: { type: string }
        port_spec: { type: string }
        interval_seconds: { type: integer, nullable: true }
        rate_pps: { type: integer, nullable: true }
        executor_scope: { type: string }
    ScanScheduleRunActive:
      type: object
      description: 409 응답 — 이미 도는 실행으로 화면이 붙을 수 있게 run id를 함께 싣는다.
      required: [error, run_id, trigger]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [schedule_run_active] }
            message: { type: string }
        run_id: { type: string, format: uuid }
        trigger: { type: string, enum: [schedule, manual] }
        request_id: { type: string }
    SweepList:
      type: object
      required: [request_id, items, total, page, page_size]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/Sweep" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    PortPresetList:
      type: object
      required: [items]
      properties:
        request_id: { type: string }
        default: { type: string, description: 포트 미지정 시 적용되는 기본 사양 (common) }
        items:
          type: array
          items:
            type: object
            required: [name, description, count]
            properties:
              name: { type: string, enum: [web, common, all] }
              description: { type: string }
              count: { type: integer }
              ports:
                type: array
                description: all은 6.5만 개라 생략된다(count만 본다).
                items: { type: integer }
    NotificationItem:
      type: object
      description: 알림함 행 1건 (사건 시점의 표시 내용을 굳혀 둔다)
      required: [id, event_id, title, body, severity, created_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        severity: { type: string, enum: [info, warning, error, critical] }
        certificate_id: { type: string, format: uuid, nullable: true }
        read_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [request_id, items, total, unread, page, page_size]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationItem" }
        total: { type: integer }
        unread: { type: integer, description: 보관하지 않은 안 읽은 알림 수(필터와 무관) }
        page: { type: integer }
        page_size: { type: integer }
    NotificationRecipient:
      type: object
      description: 수신자 1건. kind 정본은 owner|role|user|static이다 (설계 14.2).
      required: [kind]
      properties:
        kind: { type: string, enum: [owner, role, user, static] }
        role: { type: string, description: kind=role일 때의 역할 }
        user_id: { type: string, format: uuid, description: kind=user일 때의 사용자 }
        email: { type: string, description: kind=static일 때의 메일 주소 }
    NotificationPolicy:
      type: object
      required: [id, name, enabled, event_types, thresholds, channels, recipients, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        event_types:
          type: array
          items: { type: string, enum: [certificate.expiring, certificate.expired] }
        thresholds:
          type: array
          description: 만료 D-N 임계값(일)
          items: { type: integer, minimum: 1 }
        channels:
          type: array
          items: { type: string, enum: [email, webhook, inbox, syslog] }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/NotificationRecipient" }
        filter_environments:
          type: array
          nullable: true
          description: NULL/빈 배열이면 전체 대상
          items: { type: string }
        filter_department_ids:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationPolicyList:
      type: object
      required: [request_id, items, total]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationPolicy" }
        total: { type: integer }
    NotificationPolicyRequest:
      type: object
      required: [name, event_types, channels]
      properties:
        name: { type: string, maxLength: 200 }
        enabled: { type: boolean, default: true }
        event_types:
          type: array
          items: { type: string, enum: [certificate.expiring, certificate.expired] }
        thresholds:
          type: array
          description: 비우면 DB 기본값 {90,60,30,7,1}
          items: { type: integer, minimum: 1, maximum: 3650 }
        channels:
          type: array
          items: { type: string, enum: [email, webhook, inbox, syslog] }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/NotificationRecipient" }
        filter_environments:
          type: array
          items: { type: string }
        filter_department_ids:
          type: array
          items: { type: string, format: uuid }
    NotificationPolicyPatch:
      type: object
      description: 키가 없는 필드는 바뀌지 않는다.
      properties:
        name: { type: string, maxLength: 200 }
        enabled: { type: boolean }
        event_types:
          type: array
          items: { type: string, enum: [certificate.expiring, certificate.expired] }
        thresholds:
          type: array
          items: { type: integer, minimum: 1, maximum: 3650 }
        channels:
          type: array
          items: { type: string, enum: [email, webhook, inbox, syslog] }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/NotificationRecipient" }
        filter_environments:
          type: array
          items: { type: string }
        filter_department_ids:
          type: array
          items: { type: string, format: uuid }
    NotificationChannelStatus:
      type: object
      description: >
        채널 상태. **필드는 이 셋뿐이다** — 설정값(호스트·계정·비밀번호·URL)을
        담을 자리가 스키마에 없다 (설계 9.3).
      required: [channel, enabled, reason]
      properties:
        channel: { type: string, enum: [email, webhook, inbox, syslog] }
        enabled: { type: boolean }
        reason:
          type: string
          description: 비활성 사유(기동 경고 로그와 같은 문자열). secret을 담지 않는다.
    NotificationChannelList:
      type: object
      required: [items]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationChannelStatus" }
    NotificationTestResult:
      type: object
      required: [policy_id, results]
      properties:
        request_id: { type: string }
        policy_id: { type: string, format: uuid }
        results:
          type: array
          items:
            type: object
            required: [channel, status]
            properties:
              channel: { type: string, enum: [email, webhook, inbox, syslog] }
              status: { type: string, enum: [sent, skipped, failed] }
              reason:
                type: string
                description: skipped/failed 사유. 수신자 주소·비밀값을 담지 않는다.
    NotificationDelivery:
      type: object
      description: 발송 이력 1건 ("왜 안 왔는지"의 답 — 설계 14.3)
      required: [id, event_id, channel, recipient, status, attempt_count, created_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        channel: { type: string, enum: [email, webhook, inbox, syslog] }
        recipient:
          type: string
          description: 수신자 식별자(메일 주소·사용자 id). webhook/syslog는 빈 문자열이다.
        status: { type: string, enum: [pending, sending, sent, failed, skipped] }
        attempt_count: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        last_error: { type: string, nullable: true }
        sent_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        event_type: { type: string }
        severity: { type: string }
        certificate_id: { type: string, format: uuid, nullable: true }
        threshold_days: { type: integer, nullable: true }
    NotificationDeliveryList:
      type: object
      required: [request_id, items, total, page, page_size]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationDelivery" }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    AdminIPRule:
      type: object
      description: 관리 콘솔 접근을 허용하는 출발지 IP 규칙 (마이그레이션 0014)
      required: [id, cidr, description, is_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        cidr:
          type: string
          description: 정규화된 대역 표기. 단일 IP도 /32(IPv6는 /128)로 저장된다.
        description: { type: string }
        is_active: { type: boolean }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminIPAccessState:
      type: object
      description: >
        지금 이 요청이 어떻게 보이는지. 설정값(대역 문자열)은 담지 않고 설정 여부만 담는다.
      required: [client_ip, enforced, bootstrap_configured, client_via_bootstrap, trusted_proxy_configured]
      properties:
        client_ip:
          type: string
          description: 서버가 판정한 이 요청의 출발지 IP. 판정 불가면 빈 문자열.
        enforced:
          type: boolean
          description: 활성 규칙이 1건 이상이라 제한이 실제로 걸려 있는 상태.
        bootstrap_configured:
          type: boolean
          description: 비상 우회 대역(ADMIN_IP_ALLOW_BOOTSTRAP) 설정 여부.
        client_via_bootstrap:
          type: boolean
          description: 이 요청이 비상 우회 대역으로 들어왔는가(= 잠금 방지 판정 미적용).
        trusted_proxy_configured:
          type: boolean
          description: >
            XFF를 신뢰할 프록시 대역(ADMIN_IP_TRUSTED_PROXIES) 설정 여부.
            false인데 client_ip가 프론트엔드 컨테이너 주소로 보이면 이 값이 원인이다.
    AdminIPRuleList:
      type: object
      required: [items, total, access]
      properties:
        request_id: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminIPRule" }
        total: { type: integer }
        access: { $ref: "#/components/schemas/AdminIPAccessState" }
    Error:
      type: object
      description: 통일 오류 응답 (00-spec 13장)
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }
